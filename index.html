                                            <span className="text-purple-500 flex items-center gap-2"><i className="fa-solid fa-circle-plus"></i> Tambah (Pribadi)</span>
                                            <span className="text-gray-800 dark:text-gray-200 bg-purple-50 px-2 py-0.5 rounded-md border border-purple-100">{stats.penambahanPribadi} Kotak</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex flex-col justify-center">
                                    <p className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Hasil Penarikan</p>
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-sm font-semibold text-gray-600 dark:text-gray-300">Berhasil: <span className="text-wiz-green font-bold bg-wiz-green/10 px-1.5 py-0.5 rounded">{stats.berhasil}</span></span>
                                        <span className="text-sm font-semibold text-gray-600 dark:text-gray-300">Gagal: <span className="text-red-500 font-bold bg-red-50 px-1.5 py-0.5 rounded">{stats.gagal}</span></span>
                                    </div>
                                    <p className="text-[10px] font-bold text-gray-400 uppercase mt-2">Nominal Terkumpul</p>
                                    <p className="text-2xl font-black text-wiz-orange">{formatRp(stats.totalDanaBulanIni)}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeSubTab === 'master' && (
                        <div className="space-y-4 animate-in">
                            <ModuleView 
                                title="Data Kotak Pundi" 
                                data={filteredMasterPundis} 
                                columns={MasterPundiColumns} 
                                schema={MasterPundiSchema} 
                                defaultValues={{ noUrut: nextNoUrut, status: 'Aktif', tipePundi: 'Pundi Umum' }}
                                onSave={savePundi} 
                                onDelete={isAdmin ? deletePundi : null} 
                                canDelete={isAdmin}
                            />
                        </div>
                    )}
                    
                    {/* ... (Tab 'tugas' dan 'riwayat' dapat dilanjutkan jika diperlukan, logika sama) ... */}
                </div>
            );
        };

        // =========================================================================
        // 4. KOMPONEN UTAMA (App.jsx)
        // =========================================================================
        const App = () => {
            const safeGetJSON = (key, fallback) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : fallback;
                } catch(e) { return fallback; }
            };
            const safeSetJSON = (key, value) => {
                try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
            };
            const safeRemove = (key) => {
                try { localStorage.removeItem(key); } catch(e) {}
            };

            const [user, setUser] = useState(() => safeGetJSON('wiz_user_session', null));
            const [isInitializing, setIsInitializing] = useState(() => !safeGetJSON('wiz_user_session', null));
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [isOfflineMode, setIsOfflineMode] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [darkMode, setDarkMode] = useState(() => { try { return localStorage.getItem('wiz_dark_mode') === 'true'; } catch(e) { return false; } });
            
            const [isPasswordModalOpen, setIsPasswordModalOpen] = useState(false);
            const [passwordForm, setPasswordForm] = useState({ old: '', new: '' });
            const [pwdError, setPwdError] = useState('');
            const [pwdSuccess, setPwdSuccess] = useState('');
            
            const [deletePrompt, setDeletePrompt] = useState(null);
            const [viewImage, setViewImage] = useState(null);

            const [amils, setAmils] = useState(() => safeGetJSON('wiz_cache_Amil', fallbackAmils));
            const [contacts, setContacts] = useState(() => safeGetJSON('wiz_cache_Kontak', []));
            const [programs, setPrograms] = useState(() => safeGetJSON('wiz_cache_Program', []));
            const [donations, setDonations] = useState(() => safeGetJSON('wiz_cache_Donasi', []));
            const [tasks, setTasks] = useState(() => safeGetJSON('wiz_cache_Tugas', []));
            const [pundis, setPundis] = useState(() => safeGetJSON('wiz_cache_Pundi', []));
            const [riwayatPundis, setRiwayatPundis] = useState(() => safeGetJSON('wiz_cache_RiwayatPundi', []));

            useEffect(() => {
                if (darkMode) { document.documentElement.classList.add('dark'); try { localStorage.setItem('wiz_dark_mode', 'true'); } catch(e) {} } 
                else { document.documentElement.classList.remove('dark'); try { localStorage.setItem('wiz_dark_mode', 'false'); } catch(e) {} }
            }, [darkMode]);

            const fetchAllData = async (isManualRefresh = false) => {
                if (isManualRefresh) setIsRefreshing(true);
                try {
                    const res = await fetch(API_URL);
                    const result = await res.json();
                    if (result.status === 'success' && result.data) {
                        const d = result.data;
                        if (d.Amil?.length > 0) {
                            setAmils(d.Amil); safeSetJSON('wiz_cache_Amil', d.Amil);
                            const savedSession = safeGetJSON('wiz_user_session', null);
                            if (savedSession) {
                                const foundUser = d.Amil.find(a => a.email.toLowerCase() === savedSession.email.toLowerCase());
                                if (foundUser && foundUser.status === 'Aktif') { setUser(foundUser); safeSetJSON('wiz_user_session', foundUser); } 
                                else if (foundUser && foundUser.status !== 'Aktif') { handleLogout(); }
                            }
                        }
                        if (d.Kontak) { setContacts(d.Kontak); safeSetJSON('wiz_cache_Kontak', d.Kontak); }
                        if (d.Program) { setPrograms(d.Program); safeSetJSON('wiz_cache_Program', d.Program); }
                        if (d.Donasi) { setDonations(d.Donasi); safeSetJSON('wiz_cache_Donasi', d.Donasi); }
                        if (d.Tugas) { setTasks(d.Tugas); safeSetJSON('wiz_cache_Tugas', d.Tugas); }
                        if (d.Pundi) { setPundis(d.Pundi); safeSetJSON('wiz_cache_Pundi', d.Pundi); }
                        if (d.RiwayatPundi) { setRiwayatPundis(d.RiwayatPundi); safeSetJSON('wiz_cache_RiwayatPundi', d.RiwayatPundi); }
                        setIsOfflineMode(false);
                    } else { setIsOfflineMode(true); }
                } catch (err) { setIsOfflineMode(true); } finally { setIsInitializing(false); setIsRefreshing(false); }
            };

            useEffect(() => { fetchAllData(); }, []);

            const handleLogin = (email, password, setError) => {
                const foundUser = amils.find(a => a.email.toLowerCase() === email.trim().toLowerCase() && String(a.password) === String(password));
                if (foundUser) {
                    if(foundUser.status !== 'Aktif') return setError('Akses ditolak: Akun non-aktif.');
                    safeSetJSON('wiz_user_session', foundUser); safeSetJSON('wiz_user_email', email);
                    setUser(foundUser); setError('');
                } else { setError('Kredensial tidak valid.'); }
            };

            const handleLogout = () => { safeRemove('wiz_user_session'); safeRemove('wiz_user_email'); setUser(null); };

            const syncDataToSheet = async (sheetName, newData) => {
                safeSetJSON('wiz_cache_' + sheetName, newData);
                try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncData', sheetName, data: newData }) }); } catch(err) { setIsOfflineMode(true); }
            };

            const handleChangePassword = (e) => {
                e.preventDefault();
                setPwdError(''); setPwdSuccess('');
                if (String(passwordForm.old) !== String(user.password)) return setPwdError('Sandi lama salah.');
                if (passwordForm.new.length < 6) return setPwdError('Sandi baru minimal 6 karakter.');

                const newAmilsData = amils.map(a => a.id === user.id ? { ...a, password: passwordForm.new } : a);
                const updatedUser = { ...user, password: passwordForm.new };
                setAmils(newAmilsData); setUser(updatedUser);
                safeSetJSON('wiz_user_session', updatedUser); safeSetJSON('wiz_cache_Amil', newAmilsData);
                syncDataToSheet('Amil', newAmilsData);
                setPwdSuccess('Kata sandi diperbarui.');
                setTimeout(() => { setIsPasswordModalOpen(false); setPasswordForm({ old: '', new: '' }); setPwdSuccess(''); }, 1500);
            };

            const createSaveHandler = (setter, state, sheetName) => (data, isEdit) => {
                let newDataToSave = { ...data };
                if (!isEdit && sheetName === 'Kontak' && user) newDataToSave.createdBy = user.name;
                let newData = isEdit ? state.map(item => item.id === newDataToSave.id ? newDataToSave : item) : [...state, newDataToSave];
                setter(newData); safeSetJSON('wiz_cache_' + sheetName, newData); syncDataToSheet(sheetName, newData);
            };

            const createDeleteHandler = (setter, state, sheetName) => (row) => setDeletePrompt({ row, setter, state, sheetName });

            const confirmDelete = () => {
                if(!deletePrompt) return;
                const { row, setter, state, sheetName } = deletePrompt;
                const newData = state.filter(item => item.id !== row.id);
                setter(newData); safeSetJSON('wiz_cache_' + sheetName, newData); syncDataToSheet(sheetName, newData);
                setDeletePrompt(null);
            };

            if (isInitializing) return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-wiz-light dark:bg-gray-900 transition-colors">
                    <div className="w-24 h-24 mb-6 relative">
                        <div className="absolute inset-0 rounded-full border-t-4 border-wiz-green animate-spin"></div>
                        <div className="absolute inset-2 rounded-full border-r-4 border-wiz-orange animate-spin animation-delay-150"></div>
                        <i className="fa-solid fa-leaf absolute inset-0 flex items-center justify-center text-3xl text-wiz-green dark:text-emerald-400"></i>
                    </div>
                    <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100 mb-1">Menyiapkan Workspace...</h2>
                    <p className="text-sm text-gray-500 dark:text-gray-400 font-medium">Sinkronisasi data awan</p>
                </div>
            );

            if (!user) return <LoginScreen onLogin={handleLogin} amilsData={amils} darkMode={darkMode} setDarkMode={setDarkMode} onRefresh={() => fetchAllData(true)} isRefreshing={isRefreshing} />;

            const isAdmin = user?.role === 'Admin';
            
            const StatusBadge = ({ text, type }) => {
                const colors = {
                    success: 'bg-wiz-green/10 dark:bg-emerald-950/40 text-wiz-green dark:text-emerald-400 border-wiz-green/20 dark:border-emerald-800/50',
                    warning: 'bg-wiz-orange/10 dark:bg-amber-950/40 text-wiz-orange_dark dark:text-amber-400 border-wiz-orange/20 dark:border-amber-800/50',
                    danger: 'bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 border-red-100 dark:border-red-800/50',
                    neutral: 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600'
                };
                let c = colors.neutral;
                if(['Aktif', 'Berhasil', 'Selesai'].includes(text)) c = colors.success;
                else if(['Menunggu Validasi', 'Dalam Proses'].includes(text)) c = colors.warning;
                else if(['Dibatalkan', 'Gagal', 'Nonaktif'].includes(text)) c = colors.danger;
                return <span className={`px-2.5 py-1 rounded-lg text-xs font-bold border uppercase tracking-wide ${c}`}>{text}</span>;
            };

            const visibleContacts = isAdmin ? contacts : contacts.filter(c => c.createdBy === user.name);
            const contactOptions = visibleContacts.map(c => c.name);

            // ... (Config Data Sama Seperti Asli) ...
            const contactConfig = {
                title: 'Data Kontak', data: visibleContacts,
                onSave: (formData, isEdit) => {
                    let newDataToSave = { ...formData };
                    if (!isEdit && user) newDataToSave.createdBy = user.name;
                    let newContacts = isEdit ? contacts.map(item => item.id === newDataToSave.id ? newDataToSave : item) : [...contacts, newDataToSave];
                    setContacts(newContacts); syncDataToSheet('Kontak', newContacts);
                }, 
                onDelete: createDeleteHandler(setContacts, contacts, 'Kontak'),
                columns: [
                    { key: 'name', label: 'Nama' },
                    { key: 'phone', label: 'No. Telp / WA' },
                    { key: 'address', label: 'Domisili' }
                ],
                schema: [
                    { name: 'name', label: 'Nama Lengkap', required: true },
                    { name: 'phone', label: 'No. HP Utama', required: true },
                    { name: 'address', label: 'Alamat Domisili', type: 'berau_address', fullWidth: true }
                ]
            };

            const navItems = [
                { id: 'dashboard', label: 'Beranda Utama', icon: 'fa-solid fa-border-all' },
                { id: 'pundi', label: 'Manajemen Pundi', icon: 'fa-solid fa-box-open' },
                { id: 'scanner', label: 'Pindai QR Pundi', icon: 'fa-solid fa-qrcode' },
                { id: 'donatur_donasi', label: 'Donatur & Penerimaan', icon: 'fa-solid fa-hand-holding-heart' },
                { id: 'program', label: 'Campaign WIZ', icon: 'fa-solid fa-boxes-packing' }
            ];
            if (isAdmin) navItems.push({ id: 'amil', label: 'Pengaturan Sistem', icon: 'fa-solid fa-gear' });

            return (
                <div className="flex h-screen bg-wiz-light dark:bg-gray-900 overflow-hidden transition-colors duration-200">
                    {/* SIDEBAR */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-72 bg-white dark:bg-gray-800 border-r border-gray-100 dark:border-gray-700 shadow-[4px_0_24px_rgba(0,0,0,0.02)] transition-transform duration-300 ease-out ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} flex flex-col`}>
                        <div className="px-6 py-8 flex items-center justify-center">
                            <img src="https://drive.google.com/uc?id=1TcpcZtGKBKAOBAthf6Rea4HHDZ0l9tBU" alt="Logo WIZ" className="h-10 object-contain" />
                        </div>
                        
                        <nav className="flex-1 px-4 py-4 space-y-1.5 overflow-y-auto">
                            <p className="px-4 text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-3 mt-2">Menu Navigasi</p>
                            {navItems.map(item => {
                                const isActive = activeTab === item.id;
                                return (
                                    <button key={item.id} onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }}
                                        className={`w-full flex items-center gap-3.5 px-4 py-3.5 rounded-2xl transition-all duration-300 text-[14px] font-semibold
                                        ${isActive ? 'bg-gradient-to-r from-wiz-green to-[#2e8870] text-white shadow-lg shadow-wiz-green/30 translate-x-1' 
                                        : 'text-gray-500 dark:text-gray-400 hover:bg-wiz-green/5 dark:hover:bg-gray-700/60 hover:text-wiz-green dark:hover:text-emerald-400'}`}>
                                        <i className={`${item.icon} w-5 text-center ${isActive ? 'text-white' : 'text-gray-400 dark:text-gray-500'}`}></i> 
                                        {item.label}
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="p-5 border-t border-gray-50 dark:border-gray-700">
                            {isOfflineMode && (
                                <div className="bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-xs px-4 py-3 rounded-xl flex items-center gap-2 font-semibold mb-3">
                                    <i className="fa-solid fa-wifi"></i> Luring / Disconnect
                                </div>
                            )}
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl transition-colors text-sm font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 hover:text-red-600">
                                <i className="fa-solid fa-arrow-right-from-bracket"></i> Akhiri Sesi
                            </button>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative w-full">
                        <header className="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-700 px-6 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm transition-colors">
                            <div className="flex items-center gap-4">
                                <button className="lg:hidden p-2 text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                                    <i className="fa-solid fa-bars-staggered text-xl"></i>
                                </button>
                                <div className="hidden sm:block">
                                    <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100 capitalize leading-tight">{activeTab.replace('_', ' ')}</h2>
                                    <p className="text-xs text-gray-400 font-medium">{new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3 sm:gap-4">
                                <button onClick={() => setDarkMode(!darkMode)} className="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-wiz-orange dark:hover:text-yellow-400 hover:bg-wiz-orange/10 dark:hover:bg-gray-700 rounded-full transition-all">
                                    <i className={`fa-solid ${darkMode ? 'fa-sun text-yellow-400' : 'fa-moon'} text-lg`}></i>
                                </button>
                                <button onClick={() => fetchAllData(true)} disabled={isRefreshing} className="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-wiz-green dark:hover:text-emerald-400 hover:bg-wiz-green/10 dark:hover:bg-gray-700 rounded-full transition-all">
                                    <i className={`fa-solid fa-rotate text-lg ${isRefreshing ? 'fa-spin text-wiz-green' : ''}`}></i>
                                </button>
                                
                                <div className="relative group cursor-pointer">
                                    <div className="flex items-center gap-3 pl-3 sm:pl-4 border-l border-gray-200 dark:border-gray-700">
                                        <div className="hidden sm:block text-right">
                                            <p className="font-bold text-gray-700 dark:text-gray-200 text-sm">{user.name}</p>
                                            <p className="text-[11px] font-semibold text-wiz-orange dark:text-amber-400 uppercase tracking-wide">{user.role}</p>
                                        </div>
                                        <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-wiz-green to-[#2e8870] flex items-center justify-center text-white font-bold shadow-md">
                                            {user.name.charAt(0)}
                                        </div>
                                    </div>
                                    <div className="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 py-2 hidden group-hover:block z-50">
                                        <button onClick={() => setIsPasswordModalOpen(true)} className="w-full text-left px-5 py-2.5 text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-wiz-light dark:hover:bg-gray-700 hover:text-wiz-green transition-colors flex items-center gap-3">
                                            <i className="fa-solid fa-shield-halved"></i> Ganti Sandi
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <div className="flex-1 overflow-auto p-3 sm:p-6 lg:p-8 custom-scrollbar relative">
                            <div className="max-w-7xl mx-auto pb-28 sm:pb-28">
                                {activeTab === 'dashboard' && <DashboardView data={{ programs, donations, tasks, amils, pundis, riwayatPundis, contacts }} darkMode={darkMode} />}
                                {activeTab === 'donatur_donasi' && <DonaturDanDonasiView contactConfig={contactConfig} isAdmin={isAdmin} />}
                                {activeTab === 'pundi' && <PundiView pundis={pundis} setPundis={setPundis} riwayatPundis={riwayatPundis} setRiwayatPundis={setRiwayatPundis} contacts={contacts} programs={programs} user={user} syncDataToSheet={syncDataToSheet} darkMode={darkMode} amils={amils} setActiveTab={setActiveTab} />}
                                {activeTab === 'scanner' && <ScannerView pundis={pundis} riwayatPundis={riwayatPundis} setRiwayatPundis={setRiwayatPundis} user={user} syncDataToSheet={syncDataToSheet} setActiveTab={setActiveTab} />}
                            </div>
                        </div>

                        {/* BOTTOM NAVIGATION MOBILE */}
                        <div className="fixed bottom-0 left-0 right-0 lg:left-72 z-50 bg-white/95 dark:bg-gray-800/95 backdrop-blur-lg border-t border-gray-200/80 dark:border-gray-700/80 px-2 py-1.5 pb-safe shadow-[0_-4px_25px_rgba(0,0,0,0.1)] flex items-center justify-around lg:hidden">
                            {[
                                { id: 'dashboard', label: 'Beranda', icon: 'fa-solid fa-border-all' },
                                { id: 'pundi', label: 'Pundi', icon: 'fa-solid fa-box-open' },
                                { id: 'scanner', label: 'Scan', icon: 'fa-solid fa-qrcode', isCenter: true },
                                { id: 'donatur_donasi', label: 'Donatur', icon: 'fa-solid fa-hand-holding-heart' }
                            ].map(item => {
                                const isActive = activeTab === item.id;
                                if (item.isCenter) {
                                    return (
                                        <button key={item.id} onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }} className="relative -top-5 flex flex-col items-center justify-center group focus:outline-none">
                                            <div className="w-14 h-14 bg-gradient-to-tr from-wiz-green via-[#27745F] to-emerald-500 rounded-full flex items-center justify-center text-white shadow-xl shadow-wiz-green/50 border-4 border-white dark:border-gray-800">
                                                <i className={`${item.icon} text-2xl`}></i>
                                            </div>
                                            <span className={`text-[10px] font-bold mt-1 transition-colors ${isActive ? 'text-wiz-green' : 'text-gray-500'}`}>{item.label}</span>
                                        </button>
                                    );
                                }
                                return (
                                    <button key={item.id} onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }} className={`flex flex-col items-center justify-center py-1.5 px-3 rounded-2xl transition-all focus:outline-none ${isActive ? 'text-wiz-green font-bold scale-105' : 'text-gray-400'}`}>
                                        <div className={`w-8 h-8 rounded-xl flex items-center justify-center mb-0.5 ${isActive ? 'bg-wiz-green/10' : ''}`}><i className={`${item.icon} text-base`}></i></div>
                                        <span className="text-[10px] tracking-tight">{item.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </main>

                    {/* MODAL GANTI PASSWORD & KONFIRMASI HAPUS */}
                    <Modal isOpen={isPasswordModalOpen} onClose={() => setIsPasswordModalOpen(false)} title="Pengaturan Keamanan">
                        <form onSubmit={handleChangePassword} className="space-y-4">
                            {pwdError && <p className="text-sm text-red-600 bg-red-50 p-3 rounded-xl border border-red-100">{pwdError}</p>}
                            {pwdSuccess && <p className="text-sm text-wiz-green bg-wiz-green/10 p-3 rounded-xl border border-wiz-green/20">{pwdSuccess}</p>}
                            <div>
                                <label className="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1.5 uppercase">Sandi Saat Ini</label>
                                <input type="password" required value={passwordForm.old} onChange={e => setPasswordForm({...passwordForm, old: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl" />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-1.5 uppercase">Sandi Baru</label>
                                <input type="password" required value={passwordForm.new} onChange={e => setPasswordForm({...passwordForm, new: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl" />
                            </div>
                            <div className="flex justify-end pt-4 mt-2"><Button type="submit" variant="primary">Perbarui Sandi</Button></div>
                        </form>
                    </Modal>

                    <Modal isOpen={!!deletePrompt} onClose={() => setDeletePrompt(null)}>
                        <div className="p-4 flex flex-col items-center justify-center text-center">
                            <div className="bg-red-50 p-5 rounded-full text-red-500 mb-5"><i className="fa-solid fa-trash-can text-4xl"></i></div>
                            <h3 className="text-2xl font-black text-gray-800 dark:text-gray-100 mb-2">Konfirmasi Hapus</h3>
                            <p className="text-sm text-gray-500 mb-8 max-w-sm">Data akan dihapus permanen.</p>
                            <div className="flex gap-3 w-full">
                                <Button variant="secondary" className="flex-1 py-3" onClick={() => setDeletePrompt(null)}>Batal</Button>
                                <Button variant="danger" className="flex-1 py-3" onClick={confirmDelete}>Ya, Hapus</Button>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
