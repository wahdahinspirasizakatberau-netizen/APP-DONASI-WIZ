                                        <div key={p.id} className={`p-4 rounded-2xl border transition-all ${tStatus === 'Berhasil' ? 'bg-emerald-50/50 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-800/40' : tStatus === 'Dijemput' ? 'bg-yellow-50/50 dark:bg-yellow-900/10 border-yellow-200 dark:border-yellow-800/30' : 'bg-white dark:bg-gray-800 border-gray-100 dark:border-gray-700 shadow-sm'}`}>
                                            <div className="flex items-start justify-between gap-3 mb-2.5">
                                                <div className="flex items-center gap-2.5">
                                                    <span className={`w-9 h-9 rounded-xl flex items-center justify-center font-black text-sm ${tStatus === 'Berhasil' ? 'bg-wiz-green text-white shadow-sm' : tStatus === 'Dijemput' ? 'bg-yellow-500 text-white shadow-sm' : 'bg-wiz-orange/15 text-wiz-orange dark:bg-amber-900/30'}`}>
                                                        #{p.noUrut}
                                                    </span>
                                                    <div>
                                                        <div className="flex items-center gap-1.5 flex-wrap">
                                                            <h4 className="font-bold text-gray-800 dark:text-gray-100 text-sm leading-snug">{p.usaha}</h4>
                                                            <span className={`px-1.5 py-0.2 rounded text-[9px] font-bold ${p.tipePundi === 'Pundi Pribadi' ? 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300' : 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300'}`}>
                                                                {p.tipePundi === 'Pundi Pribadi' ? 'Pribadi' : 'Umum'}
                                                            </span>
                                                        </div>
                                                        <p className="text-xs text-gray-500 dark:text-gray-400 mt-0.5">{p.donorName}</p>
                                                    </div>
                                                </div>
                                                {tStatus === 'Berhasil' ? (
                                                    <span className="px-2 py-0.5 bg-wiz-green/10 text-wiz-green text-[10px] font-bold rounded-lg border border-wiz-green/20 shrink-0">
                                                        <i className="fa-solid fa-check"></i> Selesai
                                                    </span>
                                                ) : tStatus === 'Dijemput' ? (
                                                    <span className="px-2 py-0.5 bg-yellow-100 text-yellow-700 text-[10px] font-bold rounded-lg border border-yellow-200 shrink-0">
                                                        <i className="fa-solid fa-box-open"></i> Dijemput
                                                    </span>
                                                ) : (
                                                    <span className="px-2 py-0.5 bg-wiz-orange/10 text-wiz-orange text-[10px] font-bold rounded-lg border border-wiz-orange/20 shrink-0">
                                                        Belum
                                                    </span>
                                                )}
                                            </div>

                                            <p className="text-xs text-gray-500 dark:text-gray-400 mb-3 flex items-start gap-1.5 line-clamp-2">
                                                <i className="fa-solid fa-location-dot text-red-400 mt-0.5 shrink-0"></i>
                                                <span>{p.alamat}</span>
                                            </p>

                                            <div className="flex items-center justify-between gap-2 pt-2 border-t border-gray-100 dark:border-gray-700/60">
                                                <div className="flex items-center gap-1.5 flex-wrap">
                                                    {cleanPhone ? (
                                                        <a
                                                            href={`https://wa.me/${cleanPhone}?text=Assalamu'alaikum%20Bapak/Ibu%20${encodeURIComponent(p.donorName)},%20kami%20dari%20petugas%20WIZ%20Berau%20terkait%20penjemputan%20kotak%20pundi...`}
                                                            target="_blank"
                                                            rel="noreferrer"
                                                            className="px-3 py-2 bg-emerald-50 dark:bg-emerald-900/30 hover:bg-emerald-100 text-emerald-600 dark:text-emerald-400 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors"
                                                        >
                                                            <i className="fa-brands fa-whatsapp text-sm"></i> Chat WA
                                                        </a>
                                                    ) : null}

                                                    {p.mapUrl ? (() => {
                                                        const mapUrls = parseMapUrls(p.mapUrl);
                                                        return (
                                                            <div className="flex items-center gap-1">
                                                                <a
                                                                    href={mapUrls.navUrl}
                                                                    target="_blank"
                                                                    rel="noreferrer"
                                                                    className="px-2.5 py-2 bg-wiz-green/10 hover:bg-wiz-green text-wiz-green hover:text-white dark:bg-emerald-900/30 dark:text-emerald-400 rounded-xl text-xs font-bold flex items-center gap-1 transition-colors border border-wiz-green/20"
                                                                    title="Buka Navigasi Rute di Aplikasi Google Maps HP"
                                                                >
                                                                    <i className="fa-solid fa-mobile-screen text-xs"></i> Map HP
                                                                </a>
                                                                <a
                                                                    href={mapUrls.webUrl}
                                                                    target="_blank"
                                                                    rel="noreferrer"
                                                                    className="px-2.5 py-2 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 text-blue-600 dark:text-blue-400 rounded-xl text-xs font-bold flex items-center gap-1 transition-colors border border-blue-200 dark:border-blue-800"
                                                                    title="Buka di www.google.com/maps (Web)"
                                                                >
                                                                    <i className="fa-solid fa-globe text-xs"></i> Web
                                                                </a>
                                                            </div>
                                                        );
                                                    })() : null}
                                                </div>

                                                <div className="flex items-center gap-1.5 flex-wrap ml-auto">
                                                    {tStatus === 'Berhasil' ? (
                                                        <button 
                                                            onClick={() => handleOpenEditRiwayat(currentRecord)} 
                                                            className="px-3.5 py-2 text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors"
                                                        >
                                                            <i className="fa-solid fa-pen-to-square"></i> Edit Hasil
                                                        </button>
                                                    ) : tStatus === 'Dijemput' ? (
                                                        <button 
                                                            onClick={() => handleOpenEditRiwayat(currentRecord)} 
                                                            className="px-3.5 py-2 text-white bg-wiz-green hover:bg-wiz-green_dark rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors shadow-sm"
                                                        >
                                                            <i className="fa-solid fa-calculator"></i> Hitung Uang
                                                        </button>
                                                    ) : (
                                                        <>
                                                            <button 
                                                                onClick={() => setIsQuickScanOpen(true)} 
                                                                className="px-2.5 py-2 text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-700/60 hover:bg-gray-200 rounded-xl text-xs font-bold flex items-center gap-1 transition-colors"
                                                            >
                                                                <i className="fa-solid fa-qrcode"></i> Pindai
                                                            </button>
                                                            <Button 
                                                                onClick={() => { setSelectedPundi(p); setIsInputModalOpen(true); }} 
                                                                variant="accent" 
                                                                className="text-xs py-2 px-3 shadow-md w-auto"
                                                            >
                                                                <i className="fa-solid fa-hand-holding-box mr-1"></i> Jemput
                                                            </Button>
                                                        </>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* TAMPILAN TABEL STANDARD (TABLET / LAPTOP) */}
                            <div className="hidden md:block overflow-x-auto rounded-xl border border-gray-100 dark:border-gray-700">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 font-semibold border-b border-gray-100 dark:border-gray-700">
                                        <tr>
                                            <th className="px-4 py-3 text-center">Urut</th>
                                            <th className="px-4 py-3">Lokasi / Usaha</th>
                                            <th className="px-4 py-3 text-center">Aksi Laporan</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-50 dark:divide-gray-700">
                                        {filteredTugasPundis.length === 0 ? (
                                            <tr><td colSpan="3" className="px-4 py-8 text-center text-gray-400">Tidak ada data pundi yang cocok dengan filter tugas.</td></tr>
                                        ) : filteredTugasPundis.map(p => {
                                            const currentRecord = visibleRiwayatPundis.find(r => String(r.pundiId) === String(p.id) && new Date(r.date).getMonth() === currentMonth && new Date(r.date).getFullYear() === currentYear);
                                            const tStatus = currentRecord ? currentRecord.status : 'Belum';
                                            
                                            return (
                                                <tr key={p.id} className={`hover:bg-wiz-light dark:hover:bg-gray-700/50 ${tStatus === 'Berhasil' ? 'bg-wiz-green/5 dark:bg-emerald-900/10' : tStatus === 'Dijemput' ? 'bg-yellow-50 dark:bg-yellow-900/10' : ''}`}>
                                                    <td className="px-4 py-3 text-center font-black text-gray-400">{p.noUrut}</td>
                                                    <td className="px-4 py-3">
                                                        <div className="flex items-center gap-2">
                                                            <p className="font-bold text-gray-800 dark:text-gray-100">{p.usaha}</p>
                                                            <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${p.tipePundi === 'Pundi Pribadi' ? 'bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300' : 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300'}`}>
                                                                {p.tipePundi || 'Pundi Umum'}
                                                            </span>
                                                        </div>
                                                        <p className="text-xs text-gray-500 flex items-center gap-2 mt-0.5">
                                                            <span>{p.donorName} • {p.alamat}</span>
                                                            {p.mapUrl && (() => {
                                                                const mapUrls = parseMapUrls(p.mapUrl);
                                                                return (
                                                                    <span className="inline-flex items-center gap-1.5 ml-1">
                                                                        <a
                                                                            href={mapUrls.navUrl}
                                                                            target="_blank"
                                                                            rel="noreferrer"
                                                                            className="text-wiz-green hover:text-wiz-green_dark dark:text-emerald-400 font-bold inline-flex items-center gap-1 text-xs"
                                                                            title="Buka di Aplikasi Google Maps HP"
                                                                        >
                                                                            <i className="fa-solid fa-mobile-screen"></i> HP
                                                                        </a>
                                                                        <span className="text-gray-300">|</span>
                                                                        <a
                                                                            href={mapUrls.webUrl}
                                                                            target="_blank"
                                                                            rel="noreferrer"
                                                                            className="text-blue-500 hover:text-blue-700 dark:text-blue-400 font-bold inline-flex items-center gap-1 text-xs"
                                                                            title="Buka di www.google.com/maps (Web)"
                                                                        >
                                                                            <i className="fa-solid fa-globe"></i> Web
                                                                        </a>
                                                                    </span>
                                                                );
                                                            })()}
                                                        </p>
                                                    </td>
                                                    <td className="px-4 py-3 text-center">
                                                        {tStatus === 'Berhasil' ? (
                                                            <div className="flex items-center justify-center gap-2">
                                                                <span className="text-xs font-bold text-wiz-green bg-wiz-green/10 px-3 py-1.5 rounded-lg"><i className="fa-solid fa-check mr-1"></i> Selesai</span>
                                                                <button 
                                                                    onClick={() => handleOpenEditRiwayat(currentRecord)} 
                                                                    className="px-2.5 py-1.5 text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/40 rounded-lg text-xs font-semibold flex items-center gap-1 border border-blue-200 dark:border-blue-800 transition-colors" 
                                                                    title="Edit Hasil Penarikan Bulan Ini"
                                                                >
                                                                    <i className="fa-solid fa-pen-to-square"></i> Edit
                                                                </button>
                                                            </div>
                                                        ) : tStatus === 'Dijemput' ? (
                                                            <div className="flex items-center justify-center gap-2">
                                                                <span className="text-xs font-bold text-yellow-600 bg-yellow-100 px-3 py-1.5 rounded-lg"><i className="fa-solid fa-box-open mr-1"></i> Dijemput</span>
                                                                <button 
                                                                    onClick={() => handleOpenEditRiwayat(currentRecord)} 
                                                                    className="px-2.5 py-1.5 text-white bg-wiz-green hover:bg-wiz-green_dark rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors shadow-sm" 
                                                                    title="Lanjutkan untuk menghitung uang"
                                                                >
                                                                    <i className="fa-solid fa-calculator"></i> Hitung Uang
                                                                </button>
                                                            </div>
                                                        ) : (
                                                            <div className="flex items-center justify-center gap-2">
                                                                <button 
                                                                    onClick={() => setIsQuickScanOpen(true)} 
                                                                    className="px-2.5 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-[11px] font-bold transition-colors flex items-center gap-1"
                                                                >
                                                                    <i className="fa-solid fa-qrcode"></i> Pindai
                                                                </button>
                                                                <Button 
                                                                    onClick={() => { setSelectedPundi(p); setIsInputModalOpen(true); }} 
                                                                    variant="accent" 
                                                                    className="text-[11px] py-1.5 px-3"
                                                                >
                                                                    <i className="fa-solid fa-hand-holding-box mr-1"></i> Jemput Manual
                                                                </Button>
                                                            </div>
                                                        )}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>

                            {/* Modal Form Input Hasil Penarikan Manual */}
                            <Modal isOpen={isInputModalOpen} onClose={() => { setIsInputModalOpen(false); setSelectedPundi(null); }} title={selectedPundi ? `Laporan Penarikan: ${selectedPundi.usaha}` : 'Laporan Penarikan'}>
                                {selectedPundi && (
                                    <DynamicForm 
                                        schema={[
                                            { name: 'date', label: 'Tanggal Penarikan', type: 'date', required: true },
                                            { name: 'status', label: 'Status Penjemputan', type: 'select', options: [{value: 'Dijemput', label: 'Kotak Dijemput (Hitung Nanti)'}, {value: 'Berhasil', label: 'Langsung Dihitung (Selesai)'}, {value: 'Gagal', label: 'Gagal / Pundi Kosong'}], required: true },
                                            { name: 'amount', label: 'Nominal Uang (Rp) - Jika Dihitung', isCurrency: true },
                                            { name: 'receiptUrl', label: 'Foto Bukti Nota / Penarikan (Opsional)', type: 'file', fullWidth: true },
                                            { name: 'notes', label: 'Keterangan (Opsional)', type: 'textarea' }
                                        ]}
                                        defaultValues={{ 
                                            date: new Date().toISOString().split('T')[0], 
                                            status: 'Dijemput' 
                                        }}
                                        onSubmit={submitInputHasil}
                                        onCancel={() => { setIsInputModalOpen(false); setSelectedPundi(null); }}
                                    />
                                )}
                            </Modal>

                            {/* Modal Pop-up Kamera Cepat (Quick Scan) */}
                            <Modal isOpen={isQuickScanOpen} onClose={() => setIsQuickScanOpen(false)} title="Pindai QR Pundi (Penjemputan)">
                                <div className="flex flex-col items-center justify-center pt-2 pb-4 px-2">
                                    <p className="text-xs text-gray-500 text-center mb-4">Arahkan kamera ke stiker QR untuk menjemput kotak ini secara cepat.</p>
                                    <div className="w-full max-w-sm">
                                        <Html5QrcodePlugin qrCodeSuccessCallback={handleQuickScan} />
                                    </div>
                                    <div className="w-full mt-4">
                                        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Ketik Nomor Urut Manual</p>
                                        <input
                                            type="text"
                                            onChange={(e) => handleQuickScan(e.target.value)}
                                            placeholder="Contoh: 5"
                                            className="w-full px-4 py-2.5 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl text-center font-mono text-sm focus:ring-2 focus:ring-wiz-green focus:border-wiz-green outline-none text-gray-800 dark:text-gray-100 shadow-inner font-bold"
                                        />
                                    </div>
                                </div>
                            </Modal>
                        </div>
                    )}

                    {/* RIWAYAT PUNDI TAB */}
                    {activeSubTab === 'riwayat' && (
                        <div className="animate-in space-y-4">
                            {/* Filter Bar Riwayat Sedekah */}
                            <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-3">
                                <div className="flex flex-col md:flex-row gap-3">
                                    <div className="flex-1 relative">
                                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                                            <i className="fa-solid fa-magnifying-glass"></i>
                                        </div>
                                        <input
                                            type="text"
                                            value={searchRiwayat}
                                            onChange={(e) => setSearchRiwayat(e.target.value)}
                                            placeholder="Cari nama donatur, usaha, nomor pundi, catatan..."
                                            className="w-full pl-10 pr-9 py-2 bg-gray-50 dark:bg-gray-700/70 border border-gray-200 dark:border-gray-600 rounded-xl text-sm focus:ring-2 focus:ring-wiz-green focus:border-wiz-green outline-none text-gray-800 dark:text-gray-100 transition-all"
                                        />
                                        {searchRiwayat && (
                                            <button onClick={() => setSearchRiwayat('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                                                <i className="fa-solid fa-circle-xmark text-sm"></i>
                                            </button>
                                        )}
                                    </div>

                                    <div className="flex flex-wrap items-center gap-2.5">
                                        {/* Filter Bulan */}
                                        <div className="flex items-center gap-1.5 bg-gray-50 dark:bg-gray-700/70 px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-600">
                                            <i className="fa-solid fa-calendar-days text-xs text-gray-400"></i>
                                            <span className="text-xs font-semibold text-gray-500 dark:text-gray-400">Bulan:</span>
                                            <select
                                                value={monthRiwayatFilter}
                                                onChange={(e) => setMonthRiwayatFilter(e.target.value)}
                                                className="bg-transparent text-xs font-bold text-gray-700 dark:text-gray-200 outline-none cursor-pointer"
                                            >
                                                <option value="Semua" className="dark:bg-gray-800">Semua Bulan</option>
                                                {uniqueMonths.map(([key, label]) => (
                                                    <option key={key} value={key} className="dark:bg-gray-800">{label}</option>
                                                ))}
                                            </select>
                                        </div>

                                        {/* Filter Status */}
                                        <div className="flex items-center gap-1.5 bg-gray-50 dark:bg-gray-700/70 px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-600">
                                            <i className="fa-solid fa-circle-check text-xs text-gray-400"></i>
                                            <span className="text-xs font-semibold text-gray-500 dark:text-gray-400">Status:</span>
                                            <select
                                                value={statusRiwayatFilter}
                                                onChange={(e) => setStatusRiwayatFilter(e.target.value)}
                                                className="bg-transparent text-xs font-bold text-gray-700 dark:text-gray-200 outline-none cursor-pointer"
                                            >
                                                <option value="Semua" className="dark:bg-gray-800">Semua Status</option>
                                                <option value="Berhasil" className="dark:bg-gray-800">Berhasil (Dihitung)</option>
                                                <option value="Dijemput" className="dark:bg-gray-800">Dijemput (Belum Dihitung)</option>
                                                <option value="Gagal" className="dark:bg-gray-800">Gagal</option>
                                            </select>
                                        </div>

                                        {/* Filter Amil Penjemput (Admin) */}
                                        {isAdmin && uniqueAmils.length > 0 && (
                                            <div className="flex items-center gap-1.5 bg-gray-50 dark:bg-gray-700/70 px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-600">
                                                <i className="fa-solid fa-user-check text-xs text-gray-400"></i>
                                                <span className="text-xs font-semibold text-gray-500 dark:text-gray-400">Petugas:</span>
                                                <select
                                                    value={amilRiwayatFilter}
                                                    onChange={(e) => setAmilRiwayatFilter(e.target.value)}
                                                    className="bg-transparent text-xs font-bold text-gray-700 dark:text-gray-200 outline-none cursor-pointer max-w-[130px] truncate"
                                                >
                                                    <option value="Semua" className="dark:bg-gray-800">Semua Amil</option>
                                                    {uniqueAmils.map((amil, idx) => (
                                                        <option key={idx} value={amil} className="dark:bg-gray-800">{amil}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        )}

                                        {(searchRiwayat || statusRiwayatFilter !== 'Semua' || monthRiwayatFilter !== 'Semua' || amilRiwayatFilter !== 'Semua') && (
                                            <button
                                                onClick={() => { setSearchRiwayat(''); setStatusRiwayatFilter('Semua'); setMonthRiwayatFilter('Semua'); setAmilRiwayatFilter('Semua'); }}
                                                className="px-2.5 py-1.5 text-xs text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg font-semibold transition-colors flex items-center gap-1"
                                                title="Reset Semua Filter"
                                            >
                                                <i className="fa-solid fa-rotate-left"></i> Reset
                                            </button>
                                        )}
                                    </div>
                                </div>

                                <div className="flex items-center justify-between text-xs text-gray-400 dark:text-gray-500 pt-1 border-t border-gray-50 dark:border-gray-700/50">
                                    <span>
                                        Menampilkan <b>{filteredRiwayatPundis.length}</b> transaksi | Total Tersaring: <b className="text-wiz-green dark:text-emerald-400">{formatRp(filteredRiwayatPundis.filter(r => r.status === 'Berhasil').reduce((sum, r) => sum + Number(r.amount || 0), 0))}</b>
                                    </span>
                                    {filteredRiwayatPundis.length === 0 && <span className="text-amber-500 font-medium">Tidak ada transaksi yang cocok dengan filter</span>}
                                </div>
                            </div>

                            <Table 
                                columns={[
                                    { key: 'date', label: 'Tanggal', render: r => formatDate(r.date) },
                                    { key: 'donorName', label: 'Donatur & Usaha', render: r => <div><p className="font-bold">{r.donorName}</p><p className="text-xs text-gray-500">{r.usaha} (No. {r.noUrut})</p></div> },
                                    { key: 'amount', label: 'Nominal', render: r => <span className="font-bold text-wiz-green">{formatRp(r.amount)}</span> },
                                    { key: 'status', label: 'Status', render: r => <span className={`px-2 py-1 rounded text-xs font-bold ${r.status === 'Berhasil' ? 'bg-wiz-green/10 text-wiz-green' : r.status === 'Dijemput' ? 'bg-yellow-100 text-yellow-700 border border-yellow-200' : 'bg-red-50 text-red-500'}`}>{r.status}</span> },
                                    { key: 'amilName', label: 'Amil Petugas' },
                                    { key: 'receiptUrl', label: 'Bukti Nota', render: r => {
                                        if (!r.receiptUrl || String(r.receiptUrl).trim() === '') return <span className="text-gray-300 dark:text-gray-600">-</span>;
                                        const thumbUrl = getDriveThumbnailUrl(r.receiptUrl);
                                        return (
                                            <div className="relative group w-10 h-10">
                                                <img 
                                                    src={thumbUrl} alt="Bukti Nota" 
                                                    onClick={() => setViewImage ? setViewImage({ direct: thumbUrl, original: r.receiptUrl }) : window.open(r.receiptUrl, '_blank')}
                                                    onError={(e) => { e.target.style.display = 'none'; if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex'; }}
                                                    className="w-10 h-10 object-cover rounded-lg border border-gray-200 dark:border-gray-600 cursor-pointer group-hover:opacity-75 transition-opacity shadow-sm" 
                                                    title="Klik untuk perbesar"
                                                />
                                                <div 
                                                    style={{display: 'none'}} 
                                                    onClick={() => setViewImage ? setViewImage({ direct: thumbUrl, original: r.receiptUrl }) : window.open(r.receiptUrl, '_blank')}
                                                    className="absolute inset-0 bg-gray-50 dark:bg-gray-700 rounded-lg border border-gray-200 dark:border-gray-600 flex-col items-center justify-center cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 text-gray-400 hover:text-wiz-orange transition-colors"
                                                >
                                                    <i className="fa-solid fa-expand text-lg"></i>
                                                </div>
                                            </div>
                                        );
                                    }},
                                    { key: 'notes', label: 'Catatan', render: r => <span className="text-xs text-gray-500 dark:text-gray-400">{r.notes || '-'}</span> }
                                ]}
                                data={[...filteredRiwayatPundis].sort((a,b) => new Date(b.date) - new Date(a.date))}
                                onEdit={handleOpenEditRiwayat}
                                onDelete={isAdmin ? deleteRiwayat : null}
                            />

                            {/* Modal Edit Riwayat Penarikan */}
                            <Modal isOpen={isEditRiwayatOpen} onClose={() => { setIsEditRiwayatOpen(false); setEditingRiwayat(null); }} title={`Edit Laporan: ${editingRiwayat?.usaha || ''}`}>
                                {editingRiwayat && (
                                    <DynamicForm 
                                        schema={[
                                            { name: 'date', label: 'Tanggal Penarikan', type: 'date', required: true },
                                            { name: 'status', label: 'Status Penjemputan', type: 'select', options: [{value: 'Berhasil', label: 'Selesai Dihitung (Berhasil)'}, {value: 'Dijemput', label: 'Masih Dijemput (Belum Dihitung)'}, {value: 'Gagal', label: 'Gagal / Pundi Kosong'}], required: true },
                                            { name: 'amount', label: 'Nominal Uang (Rp)', isCurrency: true },
                                            { name: 'receiptUrl', label: 'Foto Bukti Nota / Penarikan (Opsional)', type: 'file', fullWidth: true },
                                            { name: 'notes', label: 'Keterangan (Opsional)', type: 'textarea' }
                                        ]}
                                        initialData={editingRiwayat}
                                        onSubmit={saveEditRiwayat}
                                        onCancel={() => { setIsEditRiwayatOpen(false); setEditingRiwayat(null); }}
                                    />
                                )}
                            </Modal>
                        </div>
                    )}

                    {/* Modal Cetak Label Stiker QR Pundi */}
                    <Modal isOpen={!!printQR} onClose={() => setPrintQR(null)} title="Cetak Stiker Pundi">
                        {printQR && (
                            <div className="flex flex-col items-center space-y-6">
                                {/* Area yang akan dicetak/di-print */}
                                <div id="print-qr-area" className="w-72 bg-white border-2 border-wiz-green rounded-3xl p-6 flex flex-col items-center text-center shadow-lg relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-2 bg-wiz-orange"></div>
                                    <img src="https://drive.google.com/uc?id=1V34EDnLvk3ORldMA7-5v3AnS5RN5E3GH" alt="Logo WIZ" className="h-10 mb-4" />
                                    <h4 className="font-black text-gray-800 text-lg uppercase tracking-tight mb-1">{printQR.tipePundi === 'Pundi Pribadi' ? 'Pundi Pribadi' : 'Kotak Amal'}</h4>
                                    <p className="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-4">Wahdah Inspirasi Zakat</p>
                                    
                                    {/* QR Code di-generate otomatis dari API publik bebas akses */}
                                    <div className="bg-white p-2 rounded-2xl shadow-sm border border-gray-100 mb-4">
                                        <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=WIZ-PUNDI-${printQR.id}&margin=0`} alt="QR Code Pundi" className="w-32 h-32" />
                                    </div>
                                    
                                    <div className="bg-wiz-green/10 text-wiz-green_dark w-full py-2.5 rounded-xl mb-2">
                                        <p className="text-[10px] font-bold uppercase tracking-wider mb-0.5 opacity-70">Nomor Registrasi</p>
                                        <p className="text-3xl font-black">{printQR.noUrut}</p>
                                    </div>
                                    <p className="font-bold text-gray-800 text-sm line-clamp-2 mt-2">{printQR.usaha}</p>
                                    <p className="text-[10px] text-gray-400 mt-1">{printQR.donorName} {printQR.tipePundi ? `(${printQR.tipePundi})` : ''}</p>
                                </div>
                                
                                <div className="flex gap-3 w-full mt-2">
                                    <Button variant="secondary" className="flex-1 py-3" onClick={() => setPrintQR(null)}>Tutup</Button>
                                    <Button variant="primary" className="flex-1 py-3" icon="fa-solid fa-print" onClick={() => {
                                        const printWindow = window.open('', '_blank');
                                        printWindow.document.write(`
                                            <html><head><title>Stiker QR Pundi - No ${printQR.noUrut}</title>
                                            <script src="https://cdn.tailwindcss.com"><\/script>
                                            </head><body class="flex items-center justify-center p-10 bg-white">
                                            ${document.getElementById('print-qr-area').outerHTML}
                                            <script>setTimeout(() => { window.print(); }, 1000);<\/script>
                                            </body></html>
                                        `);
                                        printWindow.document.close();
                                    }}>Cetak Stiker</Button>
                                </div>
                            </div>
                        )}
                    </Modal>

                </div>
            );
        };

        const App = () => {
            // Helper aman untuk membaca dan menyimpan data lokal browser
            const safeGetJSON = (key, fallback) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : fallback;
                } catch(e) {
                    return fallback;
                }
            };
            const safeSetJSON = (key, value) => {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch(e) {}
            };
            const safeRemove = (key) => {
                try {
                    localStorage.removeItem(key);
                } catch(e) {}
            };

            // Inisialisasi User & Data langsung dari memori browser agar instan tanpa loading
            const [user, setUser] = useState(() => safeGetJSON('wiz_user_session', null));
            const [isInitializing, setIsInitializing] = useState(() => !safeGetJSON('wiz_user_session', null));
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [isOfflineMode, setIsOfflineMode] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [darkMode, setDarkMode] = useState(() => {
                try {
                    return localStorage.getItem('wiz_dark_mode') === 'true';
                } catch(e) { return false; }
            });
            
            const [isPasswordModalOpen, setIsPasswordModalOpen] = useState(false);
            const [passwordForm, setPasswordForm] = useState({ old: '', new: '' });
            const [pwdError, setPwdError] = useState('');
            const [pwdSuccess, setPwdSuccess] = useState('');
            
            const [deletePrompt, setDeletePrompt] = useState(null);
            const [viewImage, setViewImage] = useState(null);

            // Data State dimuat langsung dari Cache Browser jika ada
            const [amils, setAmils] = useState(() => safeGetJSON('wiz_cache_Amil', fallbackAmils));
            const [contacts, setContacts] = useState(() => safeGetJSON('wiz_cache_Kontak', []));
            const [programs, setPrograms] = useState(() => safeGetJSON('wiz_cache_Program', []));
            const [donations, setDonations] = useState(() => safeGetJSON('wiz_cache_Donasi', []));
            const [tasks, setTasks] = useState(() => safeGetJSON('wiz_cache_Tugas', []));
            
            // State untuk Sub-Sistem Pundi dari Cache
            const [pundis, setPundis] = useState(() => safeGetJSON('wiz_cache_Pundi', []));
            const [riwayatPundis, setRiwayatPundis] = useState(() => safeGetJSON('wiz_cache_RiwayatPundi', []));

            // State untuk Campaign & Target Amil
            const [selectedCampaignBreakdown, setSelectedCampaignBreakdown] = useState(null);
            const [campaignSubTab, setCampaignSubTab] = useState('campaigns');

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    try { localStorage.setItem('wiz_dark_mode', 'true'); } catch(e) {}
                } else {
                    document.documentElement.classList.remove('dark');
                    try { localStorage.setItem('wiz_dark_mode', 'false'); } catch(e) {}
                }
            }, [darkMode]);

            const fetchAllData = async (isManualRefresh = false) => {
                if (isManualRefresh) setIsRefreshing(true);
                try {
                    const res = await fetch(API_URL);
                    const result = await res.json();
                    if (result.status === 'success' && result.data) {
                        const d = result.data;
                        if (d.Amil?.length > 0) {
                            setAmils(d.Amil);
                            safeSetJSON('wiz_cache_Amil', d.Amil);
                            
                            // Validasi sesi login tersimpan
                            const savedSession = safeGetJSON('wiz_user_session', null);
                            if (savedSession) {
                                const foundUser = d.Amil.find(a => a.email.toLowerCase() === savedSession.email.toLowerCase());
                                if (foundUser && foundUser.status === 'Aktif') {
                                    setUser(foundUser);
                                    safeSetJSON('wiz_user_session', foundUser);
                                } else if (foundUser && foundUser.status !== 'Aktif') {
                                    handleLogout(); // Otomatis logout jika akun dinonaktifkan di Spreadsheet
                                }
                            }
                        }
                        if (d.Kontak) { setContacts(d.Kontak); safeSetJSON('wiz_cache_Kontak', d.Kontak); }
                        if (d.Program) { setPrograms(d.Program); safeSetJSON('wiz_cache_Program', d.Program); }
                        if (d.Donasi) { setDonations(d.Donasi); safeSetJSON('wiz_cache_Donasi', d.Donasi); }
                        if (d.Tugas) { setTasks(d.Tugas); safeSetJSON('wiz_cache_Tugas', d.Tugas); }
                        if (d.Pundi) { setPundis(d.Pundi); safeSetJSON('wiz_cache_Pundi', d.Pundi); }
                        if (d.RiwayatPundi) { setRiwayatPundis(d.RiwayatPundi); safeSetJSON('wiz_cache_RiwayatPundi', d.RiwayatPundi); }
                        
                        setIsOfflineMode(false);
                    } else { setIsOfflineMode(true); }
                } catch (err) {
                    setIsOfflineMode(true);
                } finally {
                    setIsInitializing(false);
                    setIsRefreshing(false);
                }
            };

            useEffect(() => { fetchAllData(); }, []);

            const handleLogin = (email, password, setError) => {
                const foundUser = amils.find(a => a.email.toLowerCase() === email.trim().toLowerCase() && String(a.password) === String(password));
                if (foundUser) {
                    if(foundUser.status !== 'Aktif') return setError('Akses ditolak: Akun non-aktif.');
                    // Simpan sesi login permanen di browser
                    safeSetJSON('wiz_user_session', foundUser);
                    safeSetJSON('wiz_user_email', email);
                    setUser(foundUser);
                    setError('');
                } else { setError('Kredensial tidak valid.'); }
            };

            const handleLogout = () => {
                // Hapus sesi login saat sengaja menekan keluar
                safeRemove('wiz_user_session');
                safeRemove('wiz_user_email');
                setUser(null);
            };

            const syncDataToSheet = async (sheetName, newData) => {
                // Perbarui cache browser secara langsung
                safeSetJSON('wiz_cache_' + sheetName, newData);
                try {
                    await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'syncData', sheetName, data: newData }) });
                } catch(err) { setIsOfflineMode(true); }
            };

            const handleChangePassword = (e) => {
                e.preventDefault();
                setPwdError(''); setPwdSuccess('');
                if (String(passwordForm.old) !== String(user.password)) return setPwdError('Sandi lama salah.');
                if (passwordForm.new.length < 6) return setPwdError('Sandi baru minimal 6 karakter.');

                const newAmilsData = amils.map(a => a.id === user.id ? { ...a, password: passwordForm.new } : a);
                const updatedUser = { ...user, password: passwordForm.new };
                setAmils(newAmilsData);
                setUser(updatedUser);
                safeSetJSON('wiz_user_session', updatedUser);
                safeSetJSON('wiz_cache_Amil', newAmilsData);
                syncDataToSheet('Amil', newAmilsData);
                setPwdSuccess('Kata sandi diperbarui.');
                setTimeout(() => { setIsPasswordModalOpen(false); setPasswordForm({ old: '', new: '' }); setPwdSuccess(''); }, 1500);
            };

            const createSaveHandler = (setter, state, sheetName) => (data, isEdit) => {
                let newDataToSave = { ...data };
                if (!isEdit && sheetName === 'Kontak' && user) newDataToSave.createdBy = user.name;
                let newData = isEdit ? state.map(item => item.id === newDataToSave.id ? newDataToSave : item) : [...state, newDataToSave];
                setter(newData);
                safeSetJSON('wiz_cache_' + sheetName, newData);
                syncDataToSheet(sheetName, newData);
            };

            const createDeleteHandler = (setter, state, sheetName) => (row) => setDeletePrompt({ row, setter, state, sheetName });

            const confirmDelete = () => {
                if(!deletePrompt) return;
                const { row, setter, state, sheetName } = deletePrompt;
                const newData = state.filter(item => item.id !== row.id);
                setter(newData);
                safeSetJSON('wiz_cache_' + sheetName, newData);
                syncDataToSheet(sheetName, newData);
                setDeletePrompt(null);
            };

            const calculatedPrograms = useMemo(() => {
                const totalPundiCollected = riwayatPundis
                    .filter(r => r.status === 'Berhasil')
                    .reduce((sum, r) => sum + Number(r.amount || 0), 0);

                return programs.map(p => {
                    const isPundiCampaign = (p.category && p.category.includes('Pundi')) || (p.name && p.name.toLowerCase().includes('pundi'));
                    const isAmilSpecific = p.assignedAmil && p.assignedAmil !== 'Semua Amil (Target Kolektif)' && p.assignedAmil !== 'Semua Amil';
                    
                    const donationCollected = donations
                        .filter(d => d.programName === p.name && d.status === 'Berhasil')
                        .filter(d => !isAmilSpecific || d.amilName === p.assignedAmil)
                        .reduce((sum, d) => sum + Number(d.amount || 0), 0);
                        
                    const pundiCollected = riwayatPundis
                        .filter(r => r.status === 'Berhasil')
                        .filter(r => !isAmilSpecific || r.amilName === p.assignedAmil)
                        .reduce((sum, r) => sum + Number(r.amount || 0), 0);

                    // Jika campaign adalah kategori Pundi, otomatis gabungkan perolehan penarikan pundi
                    const collected = isPundiCampaign ? (donationCollected + (isAmilSpecific ? pundiCollected : totalPundiCollected)) : donationCollected;
                    return { ...p, collected, isPundiCampaign, isAmilSpecific };
                });
            }, [programs, donations, riwayatPundis]);

            if (isInitializing) return (
                <div className="h-screen w-full flex flex-col items-center justify-center bg-wiz-light dark:bg-gray-900 transition-colors">
                    <div className="w-24 h-24 mb-6 relative">
                        <div className="absolute inset-0 rounded-full border-t-4 border-wiz-green animate-spin"></div>
                        <div className="absolute inset-2 rounded-full border-r-4 border-wiz-orange animate-spin animation-delay-150"></div>
                        <i className="fa-solid fa-leaf absolute inset-0 flex items-center justify-center text-3xl text-wiz-green dark:text-emerald-400"></i>
                    </div>
                    <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100 mb-1">Menyiapkan Workspace...</h2>
                    <p className="text-sm text-gray-500 dark:text-gray-400 font-medium">Sinkronisasi data awan</p>
                </div>
            );

            if (!user) return <LoginScreen onLogin={handleLogin} amilsData={amils} darkMode={darkMode} setDarkMode={setDarkMode} onRefresh={() => fetchAllData(true)} isRefreshing={isRefreshing} />;

            const isAdmin = user?.role === 'Admin';
            
            const StatusBadge = ({ text, type }) => {
                const colors = {
                    success: 'bg-wiz-green/10 dark:bg-emerald-950/40 text-wiz-green dark:text-emerald-400 border-wiz-green/20 dark:border-emerald-800/50',
                    warning: 'bg-wiz-orange/10 dark:bg-amber-950/40 text-wiz-orange_dark dark:text-amber-400 border-wiz-orange/20 dark:border-amber-800/50',
                    danger: 'bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 border-red-100 dark:border-red-800/50',
                    info: 'bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 border-blue-100 dark:border-blue-800/50',
                    neutral: 'bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600'
                };
                let c = colors.neutral;
                if(['Aktif', 'Berhasil', 'Selesai'].includes(text)) c = colors.success;
                else if(['Menunggu Validasi', 'Dalam Proses'].includes(text)) c = colors.warning;
                else if(['Dibatalkan', 'Gagal', 'Nonaktif'].includes(text)) c = colors.danger;
                
                return <span className={`px-2.5 py-1 rounded-lg text-xs font-bold border uppercase tracking-wide ${c}`}>{text}</span>;
            };

            const visibleContacts = isAdmin ? contacts : contacts.filter(c => c.createdBy === user.name);
            const contactOptions = visibleContacts.map(c => c.name);

            // Logika Penyimpanan Khusus Kontak
            const handleSaveContact = (formData, isEdit) => {
                // 1. Simpan ke database Kontak
                let newDataToSave = { ...formData };
                if (!isEdit && user) newDataToSave.createdBy = user.name;
                let newContacts = isEdit ? contacts.map(item => item.id === newDataToSave.id ? newDataToSave : item) : [...contacts, newDataToSave];
                setContacts(newContacts);
                syncDataToSheet('Kontak', newContacts);
            };

            const contactConfig = {
                title: 'Data Kontak', data: visibleContacts,
                onSave: handleSaveContact, onDelete: createDeleteHandler(setContacts, contacts, 'Kontak'),
                columns: [
                    { key: 'name', label: 'Nama' },
                    { key: 'phone', label: 'No. Telp / WA', render: r => <span className="font-medium text-gray-800 dark:text-gray-200">{r.phone}</span> },
                    { key: 'sosmed', label: 'Media Sosial', render: r => (
                        <div className="flex gap-3 text-lg">
                            {r.fb && String(r.fb).trim() !== '-' && <a href={String(r.fb).startsWith('http') ? r.fb : `https://facebook.com/${r.fb}`} target="_blank" className="text-blue-500 hover:text-blue-700 dark:text-blue-400 transition-colors"><i className="fa-brands fa-facebook"></i></a>}
                            {r.ig && String(r.ig).trim() !== '-' && <a href={String(r.ig).startsWith('http') ? r.ig : `https://instagram.com/${r.ig}`} target="_blank" className="text-pink-500 hover:text-pink-700 dark:text-pink-400 transition-colors"><i className="fa-brands fa-instagram"></i></a>}
                            {r.tiktok && String(r.tiktok).trim() !== '-' && <a href={String(r.tiktok).startsWith('http') ? r.tiktok : `https://tiktok.com/@${r.tiktok}`} target="_blank" className="text-gray-700 hover:text-black dark:text-gray-300 dark:hover:text-white transition-colors"><i className="fa-brands fa-tiktok"></i></a>}
                        </div>
                    )},
                    { key: 'address', label: 'Domisili', render: r => <span className="truncate max-w-[150px] inline-block text-gray-500 dark:text-gray-400">{r.address}</span> }
                ],
                schema: [
                    { name: 'name', label: 'Nama Lengkap', required: true },
                    { name: 'phone', label: 'No. HP Utama', required: true },
                    { name: 'email', label: 'Email', type: 'email' },
                    { name: 'fb', label: 'Link Facebook' },
                    { name: 'ig', label: 'Link Instagram' },
                    { name: 'tiktok', label: 'Link TikTok' },
                    { name: 'address', label: 'Alamat Domisili', type: 'berau_address', fullWidth: true }
                ]
            };

            const programConfig = {
                title: 'Campaign WIZ BERAU', data: calculatedPrograms,
                onSave: createSaveHandler(setPrograms, programs, 'Program'), onDelete: createDeleteHandler(setPrograms, programs, 'Program'),
                columns: [
                    { key: 'name', label: 'Nama Campaign', render: r => (
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="font-bold text-gray-800 dark:text-gray-100">{r.name}</span>
                                {r.isPundiCampaign && (
                                    <span className="px-2 py-0.5 bg-wiz-orange/10 dark:bg-amber-900/30 text-wiz-orange dark:text-amber-400 text-[11px] font-bold rounded-md flex items-center gap-1 border border-wiz-orange/20">
                                        <i className="fa-solid fa-box-open"></i> Sinkron Pundi
                                    </span>
                                )}
                            </div>
                            <div className="flex flex-wrap items-center gap-2 mt-1">
                                <span className="text-[11px] text-gray-400 dark:text-gray-500">{r.category || (r.isPundiCampaign ? 'Pundi (Kotak Amal)' : 'Reguler')}</span>
                                {r.assignedAmil && r.assignedAmil !== 'Semua Amil (Target Kolektif)' ? (
                                    <span className="px-2 py-0.5 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-300 text-[11px] font-semibold rounded-md flex items-center gap-1 border border-blue-200 dark:border-blue-800">
                                        <i className="fa-solid fa-user-tag text-[10px]"></i> Amil: {r.assignedAmil}
                                    </span>
                                ) : (
                                    <span className="px-2 py-0.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-[11px] font-semibold rounded-md flex items-center gap-1">
                                        <i className="fa-solid fa-users text-[10px]"></i> Semua Amil
                                    </span>
                                )}
                            </div>
                        </div>
                    )},
                    { key: 'target', label: 'Target', render: r => formatRp(r.target) },
                    { key: 'collected', label: 'Terkumpul', render: r => (
                        <div>
                            <span className="text-wiz-green dark:text-emerald-400 font-bold">{formatRp(r.collected)}</span>
                            {r.target > 0 && (
                                <span className="ml-2 text-xs text-gray-400 font-medium">({Math.min(Math.round((r.collected / r.target) * 100), 100)}%)</span>
                            )}
                        </div>
                    )},
                    { key: 'status', label: 'Status', render: r => <StatusBadge text={r.status} /> },
                    { key: 'kontribusi', label: 'Rincian Capaian', render: r => (
                        <button
                            type="button"
                            onClick={() => setSelectedCampaignBreakdown(r)}
                            className="px-2.5 py-1 text-xs font-semibold bg-wiz-green/10 hover:bg-wiz-green text-wiz-green hover:text-white dark:bg-emerald-900/30 dark:text-emerald-300 rounded-lg transition-colors flex items-center gap-1.5 border border-wiz-green/20"
                            title="Lihat Capaian Masing-Masing Amil"
                        >
                            <i className="fa-solid fa-chart-simple"></i> Capaian Amil
                        </button>
                    )}
                ],
                schema: [
                    { name: 'name', label: 'Nama Campaign / Program', required: true, fullWidth: true },
                    { name: 'category', label: 'Jenis / Sumber Dana', type: 'select', options: ['Reguler (Donasi Umum)', 'Pundi (Kotak Amal)'], required: true },
                    { name: 'assignedAmil', label: 'Penanggung Jawab / Amil', type: 'select', options: ['Semua Amil (Target Kolektif)', ...amils.map(a => a.name)], required: true },
                    { name: 'target', label: 'Target Pendanaan', isCurrency: true, required: true },
                    { name: 'deadline', label: 'Berakhir Pada', type: 'date', required: true },
                    { name: 'status', label: 'Status Aktif', type: 'select', options: ['Aktif', 'Selesai', 'Dibatalkan'], required: true }
                ]
            };

            const donationConfig = {
                title: 'Data Transaksi', data: donations,
                defaultValues: { amilName: user?.name, date: new Date().toISOString().split('T')[0] },
                onSave: createSaveHandler(setDonations, donations, 'Donasi'), onDelete: createDeleteHandler(setDonations, donations, 'Donasi'),
                columns: [
                    { key: 'date', label: 'Tanggal', render: r => formatDate(r.date) },
                    { key: 'donorName', label: 'Donatur', render: r => <span className="font-semibold">{r.donorName}</span> },
                    { key: 'programName', label: 'Program' },
                    { key: 'rekening', label: 'Bank' },
                    { key: 'amount', label: 'Nominal', render: r => <span className="font-bold text-wiz-green dark:text-emerald-400 bg-wiz-green/5 dark:bg-wiz-green/20 px-2 py-1 rounded-md">{formatRp(r.amount)}</span> },
                    { key: 'status', label: 'Status', render: r => <StatusBadge text={r.status} /> },
                    { key: 'amilName', label: 'PIC' },
                    { key: 'receiptUrl', label: 'Bukti', render: r => {
                        if (!r.receiptUrl || String(r.receiptUrl).trim() === '') return <span className="text-gray-300 dark:text-gray-600">-</span>;
                        const directUrl = getDirectImageUrl(r.receiptUrl);
                        return (
                            <div className="relative group w-10 h-10">
                                <img 
                                    src={directUrl} alt="Bukti" 
                                    onClick={() => setViewImage({ direct: directUrl, original: r.receiptUrl })}
                                    onError={(e) => { e.target.style.display = 'none'; if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex'; }}
                                    className="w-10 h-10 object-cover rounded-lg border border-gray-200 dark:border-gray-600 cursor-pointer group-hover:opacity-75 transition-opacity shadow-sm" 
                                    title="Klik untuk perbesar"
                                />
                                <div 
                                    style={{display: 'none'}} 
                                    onClick={() => setViewImage({ direct: directUrl, original: r.receiptUrl })}
                                    className="absolute inset-0 bg-gray-50 dark:bg-gray-700 rounded-lg border border-gray-200 dark:border-gray-600 flex-col items-center justify-center cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 text-gray-400 hover:text-wiz-orange transition-colors"
                                >
                                    <i className="fa-solid fa-expand text-lg"></i>
                                </div>
                            </div>
                        );
                    }}
                ],
                schema: [
                    { name: 'donorName', label: 'Donatur Hamba Allah', type: 'select', options: contactOptions, required: true },
                    { name: 'programName', label: 'Tujuan Program', type: 'select', options: programs.map(p => p.name), required: true },
                    { name: 'rekening', label: 'Bank / Metode', type: 'select', options: ['BSI', 'Muamalat', 'QRIS', 'Tunai', 'Lainnya'], required: true },
                    { name: 'amount', label: 'Nominal', isCurrency: true, required: true },
                    { name: 'date', label: 'Tanggal Bayar', type: 'date', required: true },
                    { name: 'status', label: 'Status Transfer', type: 'select', options: ['Berhasil', 'Menunggu Validasi', 'Gagal'], required: true },
                    { name: 'amilName', label: 'PIC Amil', type: 'select', options: amils.map(a => a.name), required: true },
                    { name: 'receiptUrl', label: 'Bukti Validasi (Opsional)', type: 'file', fullWidth: true }
                ]
            };

            const visibleTasks = isAdmin ? tasks : tasks.filter(t => t.assignedTo === user.name);

            const taskConfig = {
                title: 'Tugas Operasional', data: visibleTasks,
                onSave: createSaveHandler(setTasks, tasks, 'Tugas'), onDelete: createDeleteHandler(setTasks, tasks, 'Tugas'),
                columns: [
                    { key: 'name', label: 'Uraian Tugas', render: r => <span className="font-semibold text-gray-700 dark:text-gray-200">{r.name}</span> },
                    { key: 'assignedTo', label: 'Pelaksana' },
                    { key: 'period', label: 'Siklus', render: r => <span className="text-xs bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded-md text-gray-600 dark:text-gray-300">{r.period}</span> },
                    { key: 'deadline', label: 'Batas', render: r => formatDate(r.deadline) },
                    { key: 'status', label: 'Progress', render: r => <StatusBadge text={r.status} /> }
                ],
                schema: [
                    { name: 'name', label: 'Deskripsi Pekerjaan', required: true, fullWidth: true },
                    { name: 'assignedTo', label: 'Bebankan Kepada', type: 'select', options: amils.map(a => a.name), required: true },
                    { name: 'period', label: 'Siklus Repetisi', type: 'select', options: ['Harian', 'Bulanan', 'Tahunan'], required: true },
                    { name: 'deadline', label: 'Target Selesai', type: 'date', required: true },
                    { name: 'status', label: 'Status Pengerjaan', type: 'select', options: ['Belum Selesai', 'Dalam Proses', 'Selesai'], required: true }
                ]
            };

            const amilConfig = {
            title: 'Akses Sistem', data: amils,
            onSave: createSaveHandler(setAmils, amils, 'Amil'), onDelete: createDeleteHandler(setAmils, amils, 'Amil'),
            columns: [
                { key: 'name', label: 'Nama Pengguna' },
                { key: 'email', label: 'Kredensial' },
                { key: 'role', label: 'Hak Akses', render: r => <span className={`font-bold ${r.role === 'Admin' ? 'text-wiz-orange dark:text-amber-400' : 'text-wiz-green dark:text-emerald-400'}`}>{r.role}</span> },
                { key: 'status', label: 'Status', render: r => <StatusBadge text={r.status} /> }
            ],
            schema: [
                { name: 'name', label: 'Nama Lengkap', required: true },
                { name: 'email', label: 'Email Akses', type: 'email', required: true },
                { name: 'password', label: 'Kata Sandi', required: true },
                { name: 'role', label: 'Hak Akses', type: 'select', options: ['Admin', 'Amil'], required: true },
                { name: 'status', label: 'Status Akun', type: 'select', options: ['Aktif', 'Nonaktif'], required: true }
            ]
        };

        const navItems = [
            { id: 'dashboard', label: 'Beranda Utama', icon: 'fa-solid fa-border-all' },
            { id: 'pundi', label: 'Manajemen Pundi', icon: 'fa-solid fa-box-open' },
            { id: 'scanner', label: 'Pindai QR Pundi', icon: 'fa-solid fa-qrcode' },
            { id: 'donatur_donasi', label: 'Donatur & Penerimaan', icon: 'fa-solid fa-hand-holding-heart' },
            { id: 'program', label: 'Campaign WIZ', icon: 'fa-solid fa-boxes-packing' },
            { id: 'tugas', label: 'Penugasan', icon: 'fa-solid fa-clipboard-check' },
        ];
        if (isAdmin) navItems.push({ id: 'amil', label: 'Pengaturan Sistem', icon: 'fa-solid fa-gear' });

        return (
                <div className="flex h-screen bg-wiz-light dark:bg-gray-900 overflow-hidden transition-colors duration-200">
                    {/* Layar Redup Mobile Menu */}
                    {isMobileMenuOpen && <div className="fixed inset-0 bg-gray-900/40 dark:bg-black/60 backdrop-blur-sm z-40 lg:hidden" onClick={() => setIsMobileMenuOpen(false)} />}
                    
                    {/* SIDEBAR KEREN */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-72 bg-white dark:bg-gray-800 border-r border-gray-100 dark:border-gray-700 shadow-[4px_0_24px_rgba(0,0,0,0.02)] transition-transform duration-300 ease-out ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} flex flex-col`}>
                        <div className="px-6 py-8 flex items-center justify-center">
                            <img 
                                src="https://drive.google.com/uc?id=1TcpcZtGKBKAOBAthf6Rea4HHDZ0l9tBU" 
                                alt="Logo WIZ" 
                                className="h-10 object-contain"
                                onError={(e) => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'block'; }}
                            />
                            <div style={{display: 'none'}} className="text-3xl font-black text-wiz-green dark:text-emerald-400 tracking-tighter">WIZ<span className="text-wiz-orange">BERAU</span></div>
                        </div>
                        
                        <nav className="flex-1 px-4 py-4 space-y-1.5 overflow-y-auto">
                            <p className="px-4 text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-3 mt-2">Menu Navigasi</p>
                            {navItems.map(item => {
                                const isActive = activeTab === item.id;
                                return (
                                    <button key={item.id} onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }}
                                        className={`w-full flex items-center gap-3.5 px-4 py-3.5 rounded-2xl transition-all duration-300 text-[14px] font-semibold
                                        ${isActive ? 'bg-gradient-to-r from-wiz-green to-[#2e8870] text-white shadow-lg shadow-wiz-green/30 translate-x-1' 
                                        : 'text-gray-500 dark:text-gray-400 hover:bg-wiz-green/5 dark:hover:bg-gray-700/60 hover:text-wiz-green dark:hover:text-emerald-400'}`}>
                                        <i className={`${item.icon} w-5 text-center ${isActive ? 'text-white' : 'text-gray-400 dark:text-gray-500'}`}></i> 
                                        {item.label}
                                    </button>
                                );
                            })}
                        </nav>

                        <div className="p-5 border-t border-gray-50 dark:border-gray-700">
                            {isOfflineMode && (
                                <div className="bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-xs px-4 py-3 rounded-xl flex items-center gap-2 font-semibold mb-3 border border-red-100 dark:border-red-800/50">
                                    <i className="fa-solid fa-wifi"></i> Luring / Disconnect
                                </div>
                            )}
                            <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl transition-colors text-sm font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 hover:text-red-600 border border-transparent hover:border-red-100 dark:hover:border-red-900/50">
                                <i className="fa-solid fa-arrow-right-from-bracket"></i> Akhiri Sesi
                            </button>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative w-full">
                        
                        {/* HEADER MODERN */}
                        <header className="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-100 dark:border-gray-700 px-6 py-4 flex items-center justify-between sticky top-0 z-30 shadow-sm transition-colors">
                            <div className="flex items-center gap-4">
                                <button className="lg:hidden p-2 text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors" onClick={() => setIsMobileMenuOpen(true)}>
                                    <i className="fa-solid fa-bars-staggered text-xl"></i>
                                </button>
                                <div className="hidden sm:block">
                                    <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100 capitalize leading-tight">{activeTab === 'amil' ? 'Pengaturan Sistem' : activeTab === 'donatur_donasi' ? 'Donatur & Penerimaan' : activeTab}</h2>
                                    <p className="text-xs text-gray-400 font-medium">{new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3 sm:gap-4">
                                {/* Dark Mode Toggle Button */}
                                <button 
                                    onClick={() => setDarkMode(!darkMode)} 
                                    className="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-wiz-orange dark:hover:text-yellow-400 hover:bg-wiz-orange/10 dark:hover:bg-gray-700 rounded-full transition-all border border-transparent hover:border-wiz-orange/20"
                                    title={darkMode ? "Aktifkan Mode Terang" : "Aktifkan Mode Malam"}
                                >
                                    <i className={`fa-solid ${darkMode ? 'fa-sun text-yellow-400' : 'fa-moon'} text-lg`}></i>
                                </button>

                                {/* Refresh Button */}
                                <button 
                                    onClick={() => fetchAllData(true)} 
                                    disabled={isRefreshing}
                                    className="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-wiz-green dark:hover:text-emerald-400 hover:bg-wiz-green/10 dark:hover:bg-gray-700 rounded-full transition-all border border-transparent hover:border-wiz-green/20"
                                    title="Sinkronisasi Awan"
                                >
                                    <i className={`fa-solid fa-rotate text-lg ${isRefreshing ? 'fa-spin text-wiz-green dark:text-emerald-400' : ''}`}></i>
                                </button>
