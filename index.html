<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRM WIZ Berau - Modern</title>

    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Custom Tema Warna WIZ & Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wiz: {
                            green: '#27745F',       // Hijau Logo
                            green_dark: '#1B5444',  // Hijau Gelap untuk Hover
                            orange: '#F59121',      // Oranye Logo
                            orange_dark: '#D87A15', // Oranye Gelap untuk Hover
                            light: '#F8FAF9'        // Background Abu-abu sangat muda
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React dan ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Recharts untuk Grafik Dashboard (Memerlukan prop-types) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>
    
    <!-- HTML5 QR Code Scanner untuk akses Kamera -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <!-- Babel untuk mengkompilasi JSX langsung di Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom CSS Tambahan & Animasi -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Animasi Transisi Halus */
        .animate-in { animation: fadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Scrollbar kustom keren berbasis WIZ Green */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #27745F; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #27745F; }
        
        /* Safe Area Padding untuk HP dengan gesture bar / notch */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(31, 41, 55, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-wiz-light dark:bg-gray-900 text-gray-800 dark:text-gray-100 antialiased selection:bg-wiz-green selection:text-white transition-colors duration-200">
    
    <!-- Root Container untuk React -->
    <div id="root"></div>

    <script type="text/babel">
        // Mengabaikan harmless error dari browser saat video/kamera dihentikan mendadak (AbortError)
        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && (event.reason.name === 'AbortError' || String(event.reason).includes('The play() request was interrupted'))) {
                event.preventDefault(); // Senyapkan error ini agar tidak mengganggu UI
            }
        });

        const { useState, useEffect, useMemo } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell } = window.Recharts;

        // =========================================================================
        // 1. UTILITAS & FUNGSI BANTUAN (helpers.js jika dipisah)
        // =========================================================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbxvj873D153FGw04Kbgs6nOp4svOWBq4qNgjekjpbLdy-3eQs7HfLe-rAxIzwaOvSGN/exec';

        const fallbackAmils = [
            { id: 1, name: 'Admin WIZ', email: 'admin@wizberau.or.id', role: 'Admin', status: 'Aktif', password: 'password123' },
            { id: 2, name: 'Amil WIZ', email: 'amil@wizberau.or.id', role: 'Amil', status: 'Aktif', password: 'password123' },
        ];

        const formatRp = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        const formatDate = (dateString) => {
            if (!dateString) return '-';
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString; 
            return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }).format(date);
        };

        const getDirectImageUrl = (url) => {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/uc?id=${match[1]}`;
            }
            return url;
        };

        const getDrivePreviewUrl = (url) => {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/file/d/${match[1]}/preview`;
            }
            return url;
        };

        const getDriveThumbnailUrl = (url) => {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
            }
            return url;
        };

        const parseMapUrls = (input) => {
            if (!input) return { webUrl: '', appUrl: '', navUrl: '' };
            const clean = String(input).trim();
            if (!clean) return { webUrl: '', appUrl: '', navUrl: '' };

            const coordMatch = clean.match(/([-+]?[0-9]*\.?[0-9]+)\s*,\s*([-+]?[0-9]*\.?[0-9]+)/);
            const coords = coordMatch ? `${coordMatch[1]},${coordMatch[2]}` : null;

            let webUrl = clean;
            if (coords && !clean.startsWith('http')) {
                webUrl = `https://www.google.com/maps?q=${coords}`;
            } else if (!clean.startsWith('http')) {
                webUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(clean)}`;
            }

            const navUrl = coords
                ? `https://www.google.com/maps/dir/?api=1&destination=${coords}`
                : (clean.startsWith('http') ? clean : `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(clean)}`);

            const appUrl = coords ? `geo:${coords}?q=${coords}` : navUrl;

            return { webUrl, appUrl, navUrl };
        };

        // =========================================================================
        // 2. KOMPONEN UI GLOBAL (components/ui/...)
        // =========================================================================

        // --- KOMPONEN BUTTON ---
        const Button = ({ children, onClick, variant = 'primary', className = '', type = 'button', icon, disabled = false }) => {
            const baseStyle = "flex items-center justify-center gap-2 px-4 py-2 rounded-xl font-semibold transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm";
            const variants = {
                primary: "bg-wiz-green hover:bg-wiz-green_dark text-white focus:ring-wiz-green hover:shadow-md hover:-translate-y-0.5",
                accent: "bg-gradient-to-r from-wiz-orange to-[#fca545] hover:from-wiz-orange_dark hover:to-wiz-orange text-white focus:ring-wiz-orange shadow-md hover:shadow-lg hover:-translate-y-0.5 border border-wiz-orange/20",
                secondary: "bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 focus:ring-gray-200 hover:shadow-sm",
                danger: "bg-red-50 dark:bg-red-900/30 hover:bg-red-500 text-red-600 dark:text-red-400 hover:text-white border border-red-100 dark:border-red-800 focus:ring-red-500",
                ghost: "bg-transparent hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 focus:ring-gray-500 shadow-none border border-transparent",
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {icon && <i className={icon}></i>}
                    {children}
                </button>
            );
        };

        // --- KOMPONEN MODAL ---
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-gray-900/60 dark:bg-black/75 backdrop-blur-sm animate-in">
                    <div className="bg-white dark:bg-gray-800 rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-lg max-h-[92vh] sm:max-h-[90vh] overflow-y-auto slide-up border border-white/20 dark:border-gray-700 text-gray-800 dark:text-gray-100 flex flex-col">
                        {title && (
                            <div className="flex items-center justify-between p-4 sm:p-5 border-b border-gray-100 dark:border-gray-700 sticky top-0 bg-white/95 dark:bg-gray-800/95 backdrop-blur z-10">
                                <h2 className="text-base sm:text-xl font-bold text-gray-800 dark:text-gray-100 truncate pr-2">{title}</h2>
                                <button onClick={onClose} className="w-9 h-9 flex items-center justify-center text-gray-400 hover:text-wiz-green dark:hover:text-emerald-400 hover:bg-wiz-green/10 dark:hover:bg-gray-700 rounded-full transition-colors shrink-0">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                            </div>
                        )}
                        <div className="p-4 sm:p-6 pb-8 sm:pb-6 overflow-y-auto">
                        {children}
                    </div>
                </div>
            </div>
            );
        };

        // --- KOMPONEN QR SCANNER ---
        const Html5QrcodePlugin = ({ qrCodeSuccessCallback }) => {
            const callbackRef = React.useRef(qrCodeSuccessCallback);
            React.useEffect(() => { callbackRef.current = qrCodeSuccessCallback; }, [qrCodeSuccessCallback]);
            const fileInputRef = React.useRef(null);
            const [isBlocked, setIsBlocked] = React.useState(false);
            const [isProcessingFile, setIsProcessingFile] = React.useState(false);

            const playBeep = () => {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.15);
                } catch (e) { /* Abaikan jika browser membatasi Web Audio */ }
            };

            const handleFileScan = async (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                setIsProcessingFile(true);
                try {
                    const scanner = new window.Html5Qrcode("qr-file-processor");
                    const decodedText = await scanner.scanFile(file, true);
                    playBeep();
                    if (callbackRef.current) {
                        callbackRef.current(decodedText);
                    }
                } catch (err) {
                    console.error("Gagal membaca QR dari foto:", err);
                    showCustomNotice("QR Code tidak terdeteksi pada foto. Pastikan foto QR terlihat jelas dan terang.", "bg-amber-600");
                } finally {
                    setIsProcessingFile(false);
                    if (fileInputRef.current) fileInputRef.current.value = "";
                }
            };

            const showCustomNotice = (msg, bg = "bg-red-500") => {
                const el = document.createElement('div');
                el.className = `fixed top-5 left-1/2 -translate-x-1/2 z-[100] ${bg} text-white text-xs px-4 py-2.5 rounded-xl shadow-lg transition-all text-center max-w-xs`;
                el.innerText = msg;
                document.body.appendChild(el);
                setTimeout(() => { el.remove(); }, 3500);
            };

            useEffect(() => {
                let html5QrCode;
                let isComponentMounted = true;
                let isScanningNow = false;

                const startCamera = async () => {
                    if (!window.Html5Qrcode) return;
                    
                    try {
                        html5QrCode = new window.Html5Qrcode("qr-reader");
                        const config = { 
                            fps: 15, 
                            qrbox: function (viewfinderWidth, viewfinderHeight) {
                                let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
                                let boxSize = Math.floor(minEdgeSize * 0.75);
                                let finalBoxSize = Math.max(50, boxSize);
                                return { width: finalBoxSize, height: finalBoxSize };
                            }
                        };

                        const onScanSuccess = (decodedText) => {
                            if (isScanningNow) return; 
                            isScanningNow = true;
                            playBeep();
                            
                            if (isComponentMounted && callbackRef.current) {
                                callbackRef.current(decodedText);
                            }
                            setTimeout(() => { isScanningNow = false; }, 2500);
                        };

                        await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, () => {});
                    } catch (err) {
                        console.warn("Gagal membuka kamera belakang, mencoba kamera bawaan...", err);
                        try {
                            await html5QrCode.start(
                                { facingMode: "user" }, config,
                                (decodedText) => {
                                    if (isScanningNow) return;
                                    isScanningNow = true;
                                    playBeep();
                                    if (isComponentMounted && callbackRef.current) callbackRef.current(decodedText);
                                    setTimeout(() => { isScanningNow = false; }, 2500);
                                }, () => {}
                            );
                        } catch (fallbackErr) {
                            console.error("Kamera sepenuhnya diblokir:", fallbackErr);
                            if (isComponentMounted) setIsBlocked(true);
                        }
                    }
                };

                startCamera();

                return () => {
                    isComponentMounted = false;
                    if (html5QrCode) {
                        try {
                            if (html5QrCode.isScanning) {
                                html5QrCode.stop().then(() => html5QrCode.clear()).catch(e => console.log(e));
                            }
                        } catch (e) {}
                    }
                };
            }, []);

            return (
                <div className="w-full space-y-3">
                    <input ref={fileInputRef} type="file" accept="image/*" capture="environment" onChange={handleFileScan} className="hidden" />
                    <div id="qr-file-processor" className="hidden"></div>

                    {!isBlocked ? (
                        <div id="qr-reader" className="w-full aspect-square rounded-2xl overflow-hidden bg-black flex items-center justify-center text-white relative z-10 shadow-inner border-2 border-gray-200 dark:border-gray-700">
                            <span className="animate-pulse font-medium text-sm flex items-center gap-2">
                                <i className="fa-solid fa-spinner fa-spin"></i> Menyiapkan Kamera...
                            </span>
                        </div>
                    ) : (
                        <div className="w-full aspect-square rounded-2xl bg-amber-50/80 dark:bg-amber-950/30 border-2 border-dashed border-amber-300 dark:border-amber-700 p-5 flex flex-col items-center justify-center text-center">
                            <div className="w-14 h-14 bg-amber-100 dark:bg-amber-900/50 rounded-full flex items-center justify-center text-amber-600 dark:text-amber-400 mb-3 shadow-sm">
                                <i className="fa-solid fa-camera-rotate text-2xl"></i>
                            </div>
                            <h4 className="text-sm font-bold text-gray-800 dark:text-gray-100 mb-1">Kamera Iframe Dibatasi</h4>
                            <p className="text-[11px] text-gray-500 dark:text-gray-400 mb-4 leading-relaxed max-w-xs">
                                Google Sites membatasi akses streaming kamera. Gunakan tombol kamera di bawah:
                            </p>
                            <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={isProcessingFile} className="w-full max-w-xs py-3 px-4 bg-wiz-green hover:bg-wiz-green_dark text-white rounded-xl text-xs font-bold shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 active:scale-95">
                                {isProcessingFile ? <><i className="fa-solid fa-spinner fa-spin"></i> Memindai Gambar QR...</> : <><i className="fa-solid fa-camera"></i> Buka Kamera HP (Foto QR)</>}
                            </button>
                        </div>
                    )}

                    <div className="flex items-center justify-center gap-2 pt-1">
                        <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={isProcessingFile} className="flex-1 py-2 px-3 bg-gray-100 dark:bg-gray-700/70 hover:bg-gray-200 text-gray-700 dark:text-gray-300 rounded-xl text-xs font-semibold transition-colors flex items-center justify-center gap-1.5">
                            <i className="fa-solid fa-image text-wiz-orange"></i>
                            <span>{isProcessingFile ? 'Membaca...' : 'Pilih Foto Galeri'}</span>
                        </button>

                        {window.self !== window.top && (
                            <button type="button" onClick={() => window.open(window.location.href, '_blank')} className="py-2 px-3 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 text-blue-600 dark:text-blue-400 rounded-xl text-xs font-semibold transition-colors flex items-center justify-center gap-1.5 border border-blue-100 dark:border-blue-800/40" title="Buka aplikasi langsung di browser agar kamera video aktif">
                                <i className="fa-solid fa-arrow-up-right-from-square"></i>
                                <span>Buka Layar Penuh</span>
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        // --- KOMPONEN TABLE ---
        const Table = ({ columns, data, onEdit, onDelete }) => (
            <div className="space-y-3">
                {/* TAMPILAN KHUSUS LAYAR HP (CARD VIEW) */}
                <div className="block md:hidden space-y-3">
                    {data.length === 0 ? (
                        <div className="bg-white dark:bg-gray-800 rounded-2xl p-8 text-center text-gray-400 border border-gray-100 dark:border-gray-700">
                            <i className="fa-regular fa-folder-open text-3xl mb-2"></i>
                            <p className="text-xs">Belum ada data yang ditambahkan.</p>
                        </div>
                    ) : (
                        data.map((row, idx) => (
                            <div key={idx} className="bg-white dark:bg-gray-800 rounded-2xl p-4 border border-gray-100 dark:border-gray-700 shadow-sm space-y-3 transition-all">
                                <div className="space-y-2">
                                    {columns.map((col, colIdx) => (
                                        <div key={colIdx} className="flex justify-between items-start gap-2 text-xs border-b border-gray-50 dark:border-gray-700/50 pb-2 last:border-b-0 last:pb-0">
                                            <span className="font-semibold text-gray-400 uppercase tracking-wider text-[10px] shrink-0 pt-0.5">{col.label}</span>
                                            <div className="font-medium text-gray-800 dark:text-gray-200 text-right">
                                                {col.render ? col.render(row) : row[col.key]}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                {(onEdit || onDelete) && (
                                    <div className="flex items-center justify-end gap-2 pt-2 border-t border-gray-100 dark:border-gray-700">
                                        {onEdit && (
                                            <button onClick={() => onEdit(row)} className="px-3 py-1.5 text-xs font-semibold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 rounded-xl flex items-center gap-1.5 transition-colors">
                                                <i className="fa-solid fa-pen-to-square"></i> Edit
                                            </button>
                                        )}
                                        {onDelete && (
                                            <button onClick={() => onDelete(row)} className="px-3 py-1.5 text-xs font-semibold text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/30 rounded-xl flex items-center gap-1.5 transition-colors">
                                                <i className="fa-solid fa-trash-can"></i> Hapus
                                            </button>
                                        )}
                                    </div>
                                )}
                            </div>
                        ))
                    )}
                </div>

                {/* TAMPILAN TABEL STANDARD UNTUK TABLET & DESKTOP */}
                <div className="hidden md:block overflow-x-auto bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                    <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="bg-wiz-green/5 dark:bg-gray-700/60 text-wiz-green_dark dark:text-emerald-400 font-semibold border-b border-gray-100 dark:border-gray-700">
                            <tr>
                                {columns.map((col, idx) => (
                                    <th key={idx} className="px-6 py-4">{col.label}</th>
                                ))}
                                {(onEdit || onDelete) && <th className="px-6 py-4 text-center">Aksi</th>}
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-50 dark:divide-gray-700 text-gray-600 dark:text-gray-300">
                            {data.length === 0 ? (
                                <tr>
                                    <td colSpan={columns.length + 1} className="px-6 py-12 text-center text-gray-400 dark:text-gray-500">
                                        <div className="flex flex-col items-center justify-center gap-3">
                                            <div className="w-16 h-16 bg-gray-50 dark:bg-gray-700 rounded-full flex items-center justify-center">
                                                <i className="fa-regular fa-folder-open text-2xl"></i>
                                            </div>
                                            <p>Belum ada data yang ditambahkan.</p>
                                        </div>
                                    </td>
                                </tr>
                            ) : (
                                data.map((row, idx) => (
                                    <tr key={idx} className="hover:bg-wiz-light dark:hover:bg-gray-700/50 transition-colors duration-200">
                                        {columns.map((col, colIdx) => (
                                            <td key={colIdx} className="px-6 py-4">
                                                {col.render ? col.render(row) : row[col.key]}
                                            </td>
                                        ))}
                                        {(onEdit || onDelete) && (
                                            <td className="px-6 py-4">
                                                <div className="flex items-center justify-center gap-2">
                                                    {onEdit && (
                                                        <button onClick={() => onEdit(row)} className="p-2 text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/40 hover:text-blue-600 rounded-xl transition-colors" title="Edit">
                                                            <i className="fa-solid fa-pen-to-square"></i>
                                                        </button>
                                                    )}
                                                    {onDelete && (
                                                        <button onClick={() => onDelete(row)} className="p-2 text-red-400 hover:bg-red-50 dark:hover:bg-red-900/40 hover:text-red-600 rounded-xl transition-colors" title="Hapus">
                                                            <i className="fa-solid fa-trash-can"></i>
                                                        </button>
                                                    )}
                                                </div>
                                            </td>
                                        )}
                                    </tr>
                                ))
                            )}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        // --- KOMPONEN DYNAMIC FORM ---
        const DynamicForm = ({ schema, initialData, defaultValues, onSubmit, onCancel }) => {
            const [formData, setFormData] = useState(initialData || defaultValues || {});
            const [isUploading, setIsUploading] = useState(false);
            const [uploadError, setUploadError] = useState('');

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleCurrencyChange = (e, fieldName) => {
                const val = e.target.value.replace(/\D/g, ''); 
                setFormData(prev => ({ ...prev, [fieldName]: val }));
            };

            const handleFileChange = async (e, fieldName) => {
                const file = e.target.files[0];
                if (!file) return;
                
                setIsUploading(true);
                setUploadError('');
                
                const localPreviewUrl = URL.createObjectURL(file);
                setFormData(prev => ({ ...prev, [fieldName]: localPreviewUrl }));
                
                try {
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64data = reader.result.split(',')[1];
                        const payload = { action: 'uploadImage', filename: file.name, mimeType: file.type, base64: base64data };
                        try {
                            const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                            const result = await response.json();
                            if (result.status === 'success') {
                                setFormData(prev => ({ ...prev, [fieldName]: result.url }));
                            } else {
                                setUploadError('Gagal mengupload gambar ke Google Drive.');
                            }
                        } catch(err) {
                            setUploadError('Koneksi terputus saat mengunggah foto.');
                        }
                        setIsUploading(false);
                    };
                    reader.readAsDataURL(file);
                } catch (err) {
                    setUploadError('Terjadi kesalahan saat membaca file.');
                    setIsUploading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                for (let field of schema) {
                    if (field.type === 'berau_address' && field.required) {
                        const val = formData[field.name] || '';
                        if (!val.includes('Kec.')) {
                            setUploadError(`Alamat tidak lengkap: Anda wajib memilih Kelurahan & Kecamatan dari dropdown untuk kolom "${field.label}".`);

                        }
                    }
                }
                onSubmit(formData);
            };

            const inputBaseClass = "w-full px-4 py-2.5 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-wiz-green/20 focus:border-wiz-green bg-gray-50 dark:bg-gray-700 focus:bg-white dark:focus:bg-gray-800 transition-all text-sm text-gray-800 dark:text-gray-100 outline-none";

            return (
                <form onSubmit={handleSubmit} className="space-y-5">
                    {uploadError && (
                        <div className="bg-red-50 dark:bg-red-900/30 border border-red-100 dark:border-red-800 p-4 rounded-xl text-sm text-red-600 dark:text-red-400 flex items-start gap-3">

                                                className="w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-wiz-green/10 dark:file:bg-wiz-green/20 file:text-wiz-green dark:file:text-emerald-400 hover:file:bg-wiz-green/20 cursor-pointer disabled:opacity-50 transition-colors"
                                            />
                                        </div>
                                        {isUploading && (
                                            <div className="flex items-center justify-center gap-2 text-xs text-wiz-orange font-bold animate-pulse bg-wiz-orange/10 dark:bg-amber-900/30 py-2.5 rounded-xl border border-wiz-orange/20 mt-2">
                                                <i className="fa-solid fa-spinner fa-spin"></i> Sedang Mengunggah & Menyimpan Foto...
                                            </div>
                                        )}
                                    </div>
                                ) : field.isCurrency ? (
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <span className="text-gray-400 sm:text-sm font-semibold">Rp</span>
                                        </div>
                                        <input
                                            type="text"
                                            name={field.name}

                                            className={`${inputBaseClass} pl-11`}

                                ) : field.type === 'select' ? (

                                                </div>

                                                    type="text"
                                                    name={field.name}
                                                    value={formData[field.name] || ''}
                                                    onChange={handleChange}

                                            </button>

                                                type="button"
                                                onClick={() => {
                                                    if (navigator.geolocation) {
                                                        navigator.geolocation.getCurrentPosition(
                                                            (position) => {
                                                                const lat = position.coords.latitude;
                                                                const lng = position.coords.longitude;
                                                                const url = `https://www.google.com/maps?q=${lat},${lng}`;
                                                                setFormData(prev => ({ ...prev, [field.name]: url }));
                                                            },
                                                            (error) => {
                                                                setUploadError("Gagal mendeteksi lokasi GPS. Pastikan izin lokasi / GPS diaktifkan di browser HP Anda.");
                                                            },
                                                            { enableHighAccuracy: true, timeout: 10000 }
                                                        );
                                                    } else {
                                                        setUploadError("Perangkat atau browser tidak mendukung fitur deteksi GPS.");

                                                }}
                                                className="px-3.5 py-2.5 bg-wiz-green/10 hover:bg-wiz-green text-wiz-green hover:text-white dark:bg-emerald-900/30 dark:text-emerald-400 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 whitespace-nowrap border border-wiz-green/20 shrink-0"
                                                title="Deteksi Titik GPS Posisi Saya Saat Ini"
                                            >
                                                <i className="fa-solid fa-location-crosshairs text-sm"></i> GPS HP
                                            </button>
                                        </div>
                                        {formData[field.name] && (() => {
                                            const mapUrls = parseMapUrls(formData[field.name]);
                                            return (
                                                <div className="flex flex-wrap items-center gap-2 pt-1 bg-gray-50/80 dark:bg-gray-700/50 p-2.5 rounded-xl border border-gray-200 dark:border-gray-600">
                                                    <span className="text-[11px] font-bold text-gray-500 dark:text-gray-400 flex items-center gap-1">
                                                        <i className="fa-solid fa-route text-wiz-orange"></i> Pilihan Cek Map:
                                                    </span>
                                                    <a href={mapUrls.navUrl} target="_blank" rel="noreferrer" className="px-3 py-1.5 bg-wiz-green/10 hover:bg-wiz-green text-wiz-green hover:text-white dark:bg-emerald-900/30 dark:text-emerald-400 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5 border border-wiz-green/20">
                                                        <i className="fa-solid fa-mobile-screen"></i> Buka di HP (App)
                                                    </a>
                                                    <a href={mapUrls.webUrl} target="_blank" rel="noreferrer" className="px-3 py-1.5 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 text-blue-600 dark:text-blue-400 rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5 border border-blue-200 dark:border-blue-800">
                                                        <i className="fa-solid fa-globe"></i> www.google.com/maps (Web)
                                                    </a>
                                                </div>
                                            );
                                        })()}
                                        <p className="text-[11px] text-gray-400 dark:text-gray-500">
                                            Tekan <b>"Cari di Web Maps"</b> untuk mencari lokasi titik di Google Maps, atau <b>"GPS HP"</b> jika Anda sedang berada di lokasi pundi.

                                    <div className="space-y-3">

                                            <p className="text-[11px] text-blue-600 dark:text-blue-400 font-medium leading-tight flex items-start gap-1.5">
                                                <i className="fa-solid fa-lightbulb text-yellow-500 mt-0.5"></i>
                                                <span>Langkah 1: Ketik nama Jalan/RT pada kotak di bawah.<br/>Langkah 2: Pilih Kelurahan/Kecamatan agar alamat tergabung otomatis.</span>
                                            </p>
                                        </div>
                                        <textarea
                                            name={field.name}
                                            value={formData[field.name] || ''}
                                            onChange={handleChange}
                                            required={field.required}
                                            rows={2}
                                            className={inputBaseClass}
                                            placeholder="1. Ketik nama jalan / gang / RT (Contoh: Jl. AKB Sanipah 1 RT.05)"
                                        />
                                        <select 
                                            className={`${inputBaseClass} border-wiz-green/30 dark:border-emerald-600/30 bg-wiz-green/5 dark:bg-emerald-900/10 cursor-pointer font-semibold text-wiz-green dark:text-emerald-400`} 
                                            onChange={(e) => {
                                                if(!e.target.value) return;
                                                const current = formData[field.name] || '';
                                                if(current.includes(e.target.value)) { e.target.value = ""; return; }
                                                const newVal = current ? (current + (current.trim().endsWith(',') ? ' ' : ', ') + e.target.value) : e.target.value;
                                                setFormData(prev => ({ ...prev, [field.name]: newVal }));
                                                e.target.value = ""; 
                                            }}
                                            defaultValue=""
                                        >
                                            <option value="" disabled className="dark:bg-gray-800 font-bold">2. Pilih Kelurahan & Kec. (WAJIB)</option>
                                            <optgroup label="Kec. Tanjung Redeb">
                                                <option value="Kel. Tanjung Redeb, Kec. Tanjung Redeb">Kel. Tanjung Redeb</option>
                                                <option value="Kel. Bugis, Kec. Tanjung Redeb">Kel. Bugis</option>
                                                <option value="Kel. Gayam, Kec. Tanjung Redeb">Kel. Gayam</option>
                                                <option value="Kel. Karang Ambun, Kec. Tanjung Redeb">Kel. Karang Ambun</option>
                                                <option value="Kel. Bedungun, Kec. Tanjung Redeb">Kel. Bedungun</option>
                                                <option value="Kel. Gunung Panjang, Kec. Tanjung Redeb">Kel. Gunung Panjang</option>
                                            </optgroup>
                                            <optgroup label="Kec. Teluk Bayur">
                                                <option value="Kel. Teluk Bayur, Kec. Teluk Bayur">Kel. Teluk Bayur</option>
                                                <option value="Kel. Rinding, Kec. Teluk Bayur">Kel. Rinding</option>
                                                <option value="Kampung Labanan Jaya, Kec. Teluk Bayur">Kmp. Labanan Jaya</option>
                                                <option value="Kampung Labanan Makmur, Kec. Teluk Bayur">Kmp. Labanan Makmur</option>
                                                <option value="Kampung Tumbang Jaya, Kec. Teluk Bayur">Kmp. Tumbang Jaya</option>
                                            </optgroup>
                                            <optgroup label="Kec. Sambaliung">
                                                <option value="Kel. Sambaliung, Kec. Sambaliung">Kel. Sambaliung</option>
                                                <option value="Kampung Bebanir Bangun, Kec. Sambaliung">Kmp. Bebanir Bangun</option>
                                                <option value="Kampung Gurimbang, Kec. Sambaliung">Kmp. Gurimbang</option>
                                                <option value="Kampung Limunjan, Kec. Sambaliung">Kmp. Limunjan</option>
                                                <option value="Kampung Suaran, Kec. Sambaliung">Kmp. Suaran</option>
                                            </optgroup>
                                            <optgroup label="Kec. Gunung Tabur">
                                                <option value="Kel. Gunung Tabur, Kec. Gunung Tabur">Kel. Gunung Tabur</option>
                                                <option value="Kampung Merancang Ilir, Kec. Gunung Tabur">Kmp. Merancang Ilir</option>
                                                <option value="Kampung Merancang Ulu, Kec. Gunung Tabur">Kmp. Merancang Ulu</option>
                                                <option value="Kampung Batu-Batu, Kec. Gunung Tabur">Kmp. Batu-Batu</option>
                                            </optgroup>
                                            <optgroup label="Kecamatan Lainnya (Berau)">
                                                <option value="Kec. Segah">Kec. Segah</option>
                                                <option value="Kec. Kelay">Kec. Kelay</option>
                                                <option value="Kec. Pulau Derawan">Kec. Pulau Derawan</option>
                                                <option value="Kec. Maratua">Kec. Maratua</option>
                                                <option value="Kec. Talisayan">Kec. Talisayan</option>
                                                <option value="Kec. Biatan">Kec. Biatan</option>
                                                <option value="Kec. Tabalar">Kec. Tabalar</option>
                                                <option value="Kec. Batu Putih">Kec. Batu Putih</option>
                                                <option value="Kec. Biduk-Biduk">Kec. Biduk-Biduk</option>
                                            </optgroup>
                                        </select>
                                    </div>
                                ) : field.type === 'textarea' ? (
                                    <textarea
                                        name={field.name}
                                        value={formData[field.name] || ''}
                                        onChange={handleChange}
                                        required={field.required}
                                        rows={3}
                                        className={inputBaseClass}
                                    />
                                ) : (
                                    <input
                                        type={field.type || 'text'}
                                        name={field.name}
                                        value={field.type === 'date' && formData[field.name] ? String(formData[field.name]).split('T')[0] : (formData[field.name] || '')}
                                        onChange={handleChange}
                                        required={field.required}
                                        className={inputBaseClass}
                                    />
                                )}
                            </div>
                        ))}
                    </div>
                    <div className="flex justify-end gap-3 pt-6 border-t border-gray-100 dark:border-gray-700 mt-8">
                        <Button variant="secondary" onClick={onCancel}>Batalkan</Button>
                        <Button type="submit" disabled={isUploading} variant="primary">
                            {isUploading ? (<span><i className="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...</span>) : 'Simpan Data'}

                </form>

        // --- HALAMAN DASHBOARD ---

                if (pundiPrograms.length > 0) {
                    const totalTargetPundi = pundiPrograms.reduce((sum, p) => sum + Number(p.target || 0), 0);
                    const donationPundiCollected = donations.filter(d => pundiPrograms.some(prog => prog.name === d.programName) && d.status === 'Berhasil').reduce((sum, d) => sum + Number(d.amount || 0), 0);
                    const totalPundiAll = donationPundiCollected + totalPundiCollected;

                    result.push({

                nonPundiPrograms.forEach(prog => {

            const stats = useMemo(() => {

                const uniqueDonors = new Set([...donations.map(d => d.donorName), ...riwayatPundis.map(r => r.donorName)]).size;
                const completedTasks = tasks.filter(t => t.status === 'Selesai').length;
                return { totalDonasi, uniqueDonors, activePrograms: activeProgramList.length, completedTasks, totalTasks: tasks.length };

            const donationStats = useMemo(() => {

                    const dateObj = new Date(d.date);

                    const month = dateObj.toLocaleString('id-ID', { month: 'short', year: 'numeric' });

            const amilPerformance = useMemo(() => {

                    const amilTasks = tasks.filter(t => t.assignedTo === amil.name);

                        <StatCard icon="fa-solid fa-list-check" label="Kinerja Tugas" value={`${stats.completedTasks} / ${stats.totalTasks}`} subtitle="Tugas terselesaikan" colorClass="text-purple-500 dark:text-purple-400" bgClass="bg-purple-50 dark:bg-purple-900/30" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

                            <div className="flex items-center justify-between mb-8">
                                <div className="flex items-center gap-3">
                                    <div className="p-2 bg-wiz-green/10 dark:bg-wiz-green/20 rounded-lg text-wiz-green dark:text-emerald-400"><i className="fa-solid fa-chart-line"></i></div>

                    {/* Progres Campaign */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">

                            <div className="flex items-center justify-between mb-6">
                                <div className="flex items-center gap-3">
                                    <div className="p-2 bg-blue-50 dark:bg-blue-900/40 rounded-lg text-blue-500 dark:text-blue-400"><i className="fa-solid fa-clock-rotate-left"></i></div>

                            {activeProgramList.length > 0 && (

                                        >

                                                    <span className={`font-bold text-gray-700 dark:text-gray-200 ${prog.isPundiCampaign ? 'group-hover:text-wiz-green dark:group-hover:text-emerald-400 transition-colors' : ''}`}>

                onSave({ ...formData, id: editingData ? editingData.id : Date.now() }, !!editingData);

            };

                <div className="space-y-6 slide-up">

        // --- HALAMAN DONATUR & DONASI ---

        // --- HALAMAN PUNDI SCANNER ---
        const ScannerView = ({ pundis, riwayatPundis, setRiwayatPundis, user, syncDataToSheet, setActiveTab }) => {
            const [scanInput, setScanInput] = useState('');
            const [selectedPundi, setSelectedPundi] = useState(null);
            const [isInputModalOpen, setIsInputModalOpen] = useState(false);

            const handleScan = (val) => {
                const cleanVal = String(val).trim();
                if (!cleanVal) return;

                if (cleanVal.includes('WIZ-PUNDI-')) {
                    const extractedId = cleanVal.split('WIZ-PUNDI-')[1].trim();
                    const found = pundis.find(p => String(p.id) === String(extractedId));
                    if (found) {
                        setScanInput('');
                        setSelectedPundi(found);
                        setTimeout(() => setIsInputModalOpen(true), 400);
                    } else if (cleanVal.length > 15) {
                        setScanInput('❌ Pundi Tidak Ditemukan!');
                        setTimeout(() => setScanInput(''), 2000);
                    }
                }
                else if (!isNaN(cleanVal) && cleanVal.length > 0) {
                    const found = pundis.find(p => String(p.noUrut) === cleanVal);
                    if (found) {
                        setScanInput('');
                        setSelectedPundi(found);
                        setTimeout(() => setIsInputModalOpen(true), 400);
                    } else {
                         setScanInput('❌ Nomor Tidak Ada!');
                         setTimeout(() => setScanInput(''), 2000);
                    }
                }
            };

            const submitInputHasil = (formData) => {
                const now = new Date().toISOString();
                const transaction = {
                    id: Date.now(),
                    date: formData.date || now.split('T')[0],
                    pundiId: selectedPundi.id,
                    noUrut: selectedPundi.noUrut,

        // --- HALAMAN PUNDI UTAMA ---
        const PundiView = ({ pundis, setPundis, riwayatPundis, setRiwayatPundis, contacts, programs = [], user, syncDataToSheet, darkMode, setViewImage, amils = [], setActiveTab }) => {
            const [activeSubTab, setActiveSubTab] = useState('dashboard');

            const [tipeTugasFilter, setTipeTugasFilter] = useState('Semua');
            const [urutAwal, setUrutAwal] = useState('');

            // ... (Logika helper PundiView sama persis dengan kode Anda) ...

                const updated = riwayatPundis.map(r => String(r.id) === String(editingRiwayat.id) ? { ...r, ...formData, amount: Number(formData.amount || 0), receiptUrl: formData.receiptUrl || r.receiptUrl || '' } : r);

            const deleteRiwayat = (row) => {

            const isAdmin = user?.role === 'Admin';

            }, [pundis, isAdmin, effectiveAmil, contacts]);

                if (isAdmin && effectiveAmil === 'Semua') return riwayatPundis;

            }, [riwayatPundis, isAdmin, effectiveAmil]);

            const allAmilNames = useMemo(() => {
                const names = new Set((amils || []).map(a => a.name));
                pundis.forEach(p => { const c = p.createdBy || contacts.find(cnt => cnt.name === p.donorName)?.createdBy; if (c) names.add(c); });
                riwayatPundis.forEach(r => { if (r.amilName) names.add(r.amilName); });
                return Array.from(names).filter(Boolean);
            }, [amils, pundis, riwayatPundis, contacts]);
            const uniqueAmils = allAmilNames;

            const uniqueMonths = useMemo(() => {
                const map = new Map();
                visibleRiwayatPundis.forEach(r => {
                    const d = new Date(r.date);
                    if (!isNaN(d.getTime())) {
                        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                        map.set(key, new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(d));
                    }
                });
                return Array.from(map.entries()).sort((a, b) => b[0].localeCompare(a[0]));
            }, [visibleRiwayatPundis]);

            const activePundiCampaign = useMemo(() => programs.find(p => p.status === 'Aktif' && ((p.category && p.category.includes('Pundi')) || (p.name && p.name.toLowerCase().includes('pundi')))), [programs]);

            const currentYear = new Date().getFullYear();
            
            const stats = useMemo(() => {
                const totalAktif = visiblePundis.filter(p => p.status === 'Aktif').length;
                const totalUmum = visiblePundis.filter(p => p.status === 'Aktif' && (p.tipePundi || 'Pundi Umum') === 'Pundi Umum').length;
                const totalPribadi = visiblePundis.filter(p => p.status === 'Aktif' && p.tipePundi === 'Pundi Pribadi').length;
                
                const penambahanUmum = visiblePundis.filter(p => {
                    if (!p.createdAt) return false;
                    const d = new Date(p.createdAt);
                    const matchMonth = dashMonth === 'Semua' ? true : d.getMonth() === dashMonth;
                    return matchMonth && d.getFullYear() === dashYear && (p.tipePundi || 'Pundi Umum') === 'Pundi Umum';
                }).length;

                const penambahanPribadi = visiblePundis.filter(p => {
                    if (!p.createdAt) return false;
                    const d = new Date(p.createdAt);
                    const matchMonth = dashMonth === 'Semua' ? true : d.getMonth() === dashMonth;
                    return matchMonth && d.getFullYear() === dashYear && p.tipePundi === 'Pundi Pribadi';
                }).length;

                const ditarikBulanIni = visiblePundis.filter(p => {
                    if (!p.updatedAt) return false;
                    const d = new Date(p.updatedAt);
                    const matchMonth = dashMonth === 'Semua' ? true : d.getMonth() === dashMonth;
                    return p.status === 'Ditarik' && matchMonth && d.getFullYear() === dashYear;
                }).length;
                
                const riwayatBulanIni = visibleRiwayatPundis.filter(r => {
                    const d = new Date(r.date);
                    const matchMonth = dashMonth === 'Semua' ? true : d.getMonth() === dashMonth;
                    return matchMonth && d.getFullYear() === dashYear;
                });
                
                const berhasil = riwayatBulanIni.filter(r => r.status === 'Berhasil').length;
                const gagal = riwayatBulanIni.filter(r => r.status === 'Gagal').length;
                const totalDanaBulanIni = riwayatBulanIni.filter(r => r.status === 'Berhasil').reduce((sum, r) => sum + Number(r.amount || 0), 0);
                const totalDanaKumulatif = visibleRiwayatPundis.filter(r => r.status === 'Berhasil').reduce((sum, r) => sum + Number(r.amount || 0), 0);

                return { totalAktif, totalUmum, totalPribadi, penambahanUmum, penambahanPribadi, ditarikBulanIni, berhasil, gagal, totalDanaBulanIni, totalDanaKumulatif };
            }, [visiblePundis, visibleRiwayatPundis, dashMonth, dashYear]);

            const activePundisSorted = [...visiblePundis].filter(p => p.status === 'Aktif').sort((a, b) => Number(a.noUrut) - Number(b.noUrut));

            const filteredMasterPundis = useMemo(() => {
                const filtered = visiblePundis.filter(p => {
                    const creator = p.createdBy || contacts.find(c => c.name === p.donorName)?.createdBy || '';
                    const term = searchMaster.toLowerCase().trim();
                    const matchSearch = !term || String(p.noUrut || '').toLowerCase().includes(term) || String(p.donorName || '').toLowerCase().includes(term) || String(p.usaha || '').toLowerCase().includes(term) || String(p.alamat || '').toLowerCase().includes(term) || String(p.tipePundi || '').toLowerCase().includes(term) || String(p.phone || '').toLowerCase().includes(term);
                    const matchStatus = statusMasterFilter === 'Semua' || p.status === statusMasterFilter;
                    const matchCreator = creatorMasterFilter === 'Semua' || creator === creatorMasterFilter;
                    const matchTipe = tipeMasterFilter === 'Semua' || (p.tipePundi || 'Pundi Umum') === tipeMasterFilter;
                    return matchSearch && matchStatus && matchCreator && matchTipe;
                });
                return filtered.sort((a, b) => {
                    const numA = Number(a.noUrut) || 0;
                    const numB = Number(b.noUrut) || 0;
                    return masterSortOrder === 'asc' ? numA - numB : numB - numA;
                });
            }, [visiblePundis, searchMaster, statusMasterFilter, creatorMasterFilter, tipeMasterFilter, masterSortOrder, contacts]);

            const filteredTugasPundis = useMemo(() => {
                return activePundisSorted.filter(p => {
                    const currentRecord = visibleRiwayatPundis.find(r => String(r.pundiId) === String(p.id) && new Date(r.date).getMonth() === currentMonth && new Date(r.date).getFullYear() === currentYear);
                    const pStatus = currentRecord ? currentRecord.status : 'Belum';
                    
                    const term = searchTugas.toLowerCase().trim();
                    const matchSearch = !term || String(p.noUrut || '').toLowerCase().includes(term) || String(p.donorName || '').toLowerCase().includes(term) || String(p.usaha || '').toLowerCase().includes(term) || String(p.alamat || '').toLowerCase().includes(term);
                    
                    let matchStatus = false;
                    if (statusTugasFilter === 'Semua') matchStatus = true;
                    else if (statusTugasFilter === 'Belum' && pStatus === 'Belum') matchStatus = true;
                    else if (statusTugasFilter === 'Dijemput' && pStatus === 'Dijemput') matchStatus = true;
                    else if (statusTugasFilter === 'Sudah Ditarik' && pStatus === 'Berhasil') matchStatus = true;

                    const matchTipe = tipeTugasFilter === 'Semua' || (p.tipePundi || 'Pundi Umum') === tipeTugasFilter;
                    const pNo = Number(p.noUrut);
                    const matchUrutAwal = urutAwal === '' || isNaN(Number(urutAwal)) || pNo >= Number(urutAwal);
                    const matchUrutAkhir = urutAkhir === '' || isNaN(Number(urutAkhir)) || pNo <= Number(urutAkhir);

                    return matchSearch && matchStatus && matchTipe && matchUrutAwal && matchUrutAkhir;
                });
            }, [activePundisSorted, visibleRiwayatPundis, searchTugas, statusTugasFilter, tipeTugasFilter, urutAwal, urutAkhir, currentMonth, currentYear]);

            const filteredRiwayatPundis = useMemo(() => {
                return visibleRiwayatPundis.filter(r => {
                    const term = searchRiwayat.toLowerCase().trim();
                    const matchSearch = !term || String(r.noUrut || '').toLowerCase().includes(term) || String(r.donorName || '').toLowerCase().includes(term) || String(r.usaha || '').toLowerCase().includes(term) || String(r.notes || '').toLowerCase().includes(term);
                    const matchStatus = statusRiwayatFilter === 'Semua' || r.status === statusRiwayatFilter;
                    const matchAmil = amilRiwayatFilter === 'Semua' || r.amilName === amilRiwayatFilter;
                    let matchMonth = true;
                    if (monthRiwayatFilter !== 'Semua') {
                        const d = new Date(r.date);
                        if (!isNaN(d.getTime())) matchMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` === monthRiwayatFilter;
                    }
                    return matchSearch && matchStatus && matchAmil && matchMonth;
                });
            }, [visibleRiwayatPundis, searchRiwayat, statusRiwayatFilter, monthRiwayatFilter, amilRiwayatFilter]);
            
            const nextNoUrut = useMemo(() => pundis.reduce((max, p) => Math.max(max, Number(p.noUrut) || 0), 0) + 1, [pundis]);

            const handleQuickScan = (val) => {
                const cleanVal = String(val).trim();
                if (!cleanVal) return;
                let foundPundi = null;
                if (cleanVal.includes('WIZ-PUNDI-')) {
                    const extractedId = cleanVal.split('WIZ-PUNDI-')[1].trim();
                    foundPundi = pundis.find(p => String(p.id) === String(extractedId));
                } else if (!isNaN(cleanVal) && cleanVal.length > 0) {
                    foundPundi = pundis.find(p => String(p.noUrut) === cleanVal);
                }
                if (foundPundi) {
                    setIsQuickScanOpen(false); setSelectedPundi(foundPundi);
                    setTimeout(() => setIsInputModalOpen(true), 400);
                } else {
                    const el = document.createElement('div');
                    el.className = `fixed top-5 left-1/2 -translate-x-1/2 z-[100] bg-red-500 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg transition-all text-center`;
                    el.innerText = "❌ QR Pundi tidak ditemukan di sistem.";
                    document.body.appendChild(el); setTimeout(() => el.remove(), 3000);
                }

            const handlePrintChecklist = () => { /* Logika cetak sama seperti asli */ };
            const handlePrintNotaA4 = () => { /* Logika cetak sama seperti asli */ };

            const savePundi = (formData, isEdit) => {

                const existing = isEdit ? pundis.find(p => String(p.id) === String(formData.id)) : null;
                let newData = { ...existing, ...formData, tipePundi: formData.tipePundi || (existing && existing.tipePundi) || 'Pundi Umum', updatedAt: now };
                if (!isEdit) { newData.id = Date.now(); newData.createdAt = now; newData.createdBy = user.name; }
                const updatedList = isEdit ? pundis.map(p => String(p.id) === String(newData.id) ? newData : p) : [...pundis, newData];
                setPundis(updatedList); syncDataToSheet('Pundi', updatedList);

                const updatedList = pundis.filter(p => String(p.id) !== String(row.id));

                { name: 'alamat', label: 'Alamat Spesifik Pundi', type: 'berau_address', fullWidth: true, required: true },
                { name: 'mapUrl', label: 'Titik Lokasi Google Maps (GPS)', type: 'map_location', fullWidth: true }
            ];

                { key: 'noUrut', label: 'No. Urut', render: r => <span className="w-8 h-8 flex items-center justify-center bg-gray-100 dark:bg-gray-700 rounded-lg font-black text-gray-700 dark:text-gray-300">{r.noUrut}</span> },

                    <div>

                                {r.tipePundi || 'Pundi Umum'}

                { key: 'alamat', label: 'Alamat & Titik Peta', render: r => (
                    <div className="space-y-1">
                        <span className="truncate max-w-[200px] block text-gray-500">{r.alamat}</span>

                            const mapUrls = parseMapUrls(r.mapUrl);
                            return (
                                <div className="flex items-center gap-1.5 flex-wrap">
                                    <a href={mapUrls.navUrl} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-wiz-green/10 text-wiz-green dark:text-emerald-400 text-[11px] font-bold hover:bg-wiz-green hover:text-white transition-colors border border-wiz-green/20" title="Buka di Aplikasi Google Maps HP">
                                        <i className="fa-solid fa-mobile-screen"></i> Di HP
                                    </a>
                                    <a href={mapUrls.webUrl} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 text-[11px] font-bold hover:bg-blue-100 transition-colors border border-blue-200 dark:border-blue-800" title="Buka di www.google.com/maps Langsung">
                                        <i className="fa-solid fa-globe"></i> Web Maps

                { key: 'status', label: 'Status', render: r => <span className={`px-2 py-1 rounded text-xs font-bold ${r.status === 'Aktif' ? 'bg-wiz-green/10 text-wiz-green' : 'bg-red-50 text-red-500'}`}>{r.status}</span> },
                { key: 'createdBy', label: 'Dibuat Oleh', render: r => {
                    const creator = r.createdBy || contacts.find(c => c.name === r.donorName)?.createdBy;

                    <button onClick={() => setPrintQR(r)} className="p-2 text-wiz-orange hover:bg-wiz-orange/10 rounded-lg transition-colors" title="Cetak Stiker QR">
                        <i className="fa-solid fa-qrcode text-lg"></i>
                    </button>
                )}
            ];

            return (
                <div className="space-y-6 slide-up relative">

                                <i className={`fa-solid ${tab.icon}`}></i> {tab.label}

                    </div>

                    {/* Rendering Sub Tabs untuk Pundi */}
                    {activeSubTab === 'dashboard' && (
                        <div className="space-y-6 animate-in">
                            <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div>

                                    <select value={dashMonth} onChange={(e) => setDashMonth(e.target.value === 'Semua' ? 'Semua' : Number(e.target.value))} className="flex-1 sm:flex-none px-3 py-2 bg-gray-50 dark:bg-gray-700/70 border border-gray-200 dark:border-gray-600 rounded-xl text-xs font-bold text-gray-700 dark:text-gray-200 outline-none cursor-pointer focus:ring-2 focus:ring-wiz-green">
                                        <option value="Semua" className="dark:bg-gray-800">Semua Bulan</option>

                                    <p className="text-sm font-semibold opacity-80 uppercase tracking-wide mb-1">Total Pundi Aktif</p>

                                    <div className="flex items-center gap-3 mt-3 pt-3 border-t border-white/20 text-xs">
                                        <span className="bg-white/20 px-2 py-0.5 rounded-md font-semibold"><i className="fa-solid fa-store mr-1"></i> {stats.totalUmum} Umum</span>

                                    </div>
                                </div>
                                <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex flex-col justify-center">
                                    <p className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Aktivitas Kotak</p>
                                    <div className="space-y-3.5">
                                        <div className="flex justify-between items-center text-sm font-semibold">
                                            <span className="text-blue-500 flex items-center gap-2"><i className="fa-solid fa-circle-plus"></i> Tambah (Umum)</span>

                                        </div>
